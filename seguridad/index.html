<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Repaso RA1 Seguridad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Cuaderno de apuntes técnico: columna de lectura ancha, índice lateral, y un color fijo por tipo de palabra */
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface-2:#f1efea; --surface-3:#e7e4dd;
  --fg:#1c1b19; --fg-soft:#5d5a54; --line:#dcd8d0; --line-soft:#eae7e0;
  /* colores con significado */
  --c-term:#4338ca;  --c-term-bg:#eceafe;   /* concepto / término que hay que saber nombrar */
  --c-num:#0e7490;   --c-num-bg:#dff1f5;    /* cifra, unidad, dato exacto */
  --c-no:#b4232a;    --c-no-bg:#fbe6e6;     /* prohibido, nunca, incorrecto, riesgo */
  --c-si:#15803d;    --c-si-bg:#e2f3e6;     /* correcto, recomendado, ventaja */
  --c-def:#8a5a00;   --c-def-bg:#fcf0d4;    /* definición literal a memorizar */
  --accent:#4338ca;
  --font-ui:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --fs:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --surface:#1b1d21; --surface-2:#23262b; --surface-3:#2d3137;
  --fg:#e9e8e4; --fg-soft:#a3a29d; --line:#343840; --line-soft:#282b31;
  --c-term:#a5b4fc; --c-term-bg:#231f4d;
  --c-num:#67e8f9; --c-num-bg:#113038;
  --c-no:#fca5a5; --c-no-bg:#3a1b1c;
  --c-si:#86efac; --c-si-bg:#14301f;
  --c-def:#fcd34d; --c-def-bg:#352a0c;
  --accent:#a5b4fc; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1b1d21; --surface-2:#23262b; --surface-3:#2d3137;
  --fg:#e9e8e4; --fg-soft:#a3a29d; --line:#343840; --line-soft:#282b31;
  --c-term:#a5b4fc; --c-term-bg:#231f4d;
  --c-num:#67e8f9; --c-num-bg:#113038;
  --c-no:#fca5a5; --c-no-bg:#3a1b1c;
  --c-si:#86efac; --c-si-bg:#14301f;
  --c-def:#fcd34d; --c-def-bg:#352a0c;
  --accent:#a5b4fc; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs);line-height:1.68;margin:0;letter-spacing:.002em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4,.ui{font-family:var(--font-ui);font-weight:700}
h1,h2,h3{text-wrap:balance;line-height:1.18;margin:0;letter-spacing:-.015em}
p{margin:0 0 .85em}
code,kbd,.mono{font-family:var(--font-mono);font-size:.85em;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;padding:.1em .35em;white-space:nowrap}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:14px 0;font-family:var(--font-mono);font-size:.84rem;line-height:1.6}
pre code{background:none;border:0;padding:0;white-space:pre}
a{color:var(--c-term)}
:focus-visible{outline:2px solid var(--c-term);outline-offset:2px;border-radius:4px}
::selection{background:var(--c-def-bg);color:var(--fg)}

/* ====== PALABRAS CON SIGNIFICADO ====== */
b,strong,.t{color:var(--c-term);font-weight:700}            /* término clave */
.n{color:var(--c-num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}  /* cifra o dato exacto */
.no{color:var(--c-no);font-weight:700}                       /* prohibido / nunca / riesgo */
.si{color:var(--c-si);font-weight:700}                       /* correcto / recomendado */
.def{background:var(--c-def-bg);color:var(--fg);font-weight:600;border-radius:4px;padding:.05em .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.k{font-family:var(--font-ui);font-weight:700;font-size:1.01em;color:var(--c-term)}
em,i{color:var(--fg-soft)}
u{text-decoration-color:var(--c-term);text-decoration-thickness:2px;text-underline-offset:3px}

/* leyenda */
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 22px;font-size:.85rem}
.leyenda span{font-family:var(--font-ui);font-weight:700;font-size:.8rem;white-space:nowrap}
.leyenda .lg-t{color:var(--c-term)}.leyenda .lg-n{color:var(--c-num)}.leyenda .lg-no{color:var(--c-no)}.leyenda .lg-si{color:var(--c-si)}
.leyenda .lg-d{background:var(--c-def-bg);border-radius:4px;padding:.1em .3em;color:var(--fg)}
.leyenda .tt{font-family:var(--font-ui);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-soft);width:100%}

/* ====== CABECERA ====== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;max-width:1220px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font-family:var(--font-ui);font-weight:800;letter-spacing:-.025em;font-size:1.02rem;display:flex;align-items:center;gap:9px;margin-right:auto;color:var(--fg)}
.dot{width:9px;height:9px;border-radius:2px;background:var(--c-term);box-shadow:0 0 0 4px var(--c-term-bg);flex:none}
.count{font-family:var(--font-ui);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-no);background:var(--c-no-bg);border-radius:6px;padding:4px 9px;white-space:nowrap}
.tools{display:flex;gap:5px;align-items:center}
.iconbtn{font-family:var(--font-ui);font-size:.78rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-soft);padding:5px 10px;border-radius:7px;cursor:pointer;line-height:1.3}
.iconbtn:hover{border-color:var(--c-term);color:var(--c-term)}
nav{display:flex;gap:3px;flex-wrap:wrap;width:100%}
nav button{font-family:var(--font-ui);font-size:.85rem;font-weight:700;background:none;border:1px solid transparent;color:var(--fg-soft);padding:7px 13px;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--surface-2);color:var(--fg)}
nav button[aria-current="true"]{background:var(--c-term);color:var(--bg);border-color:var(--c-term)}
:root[data-theme="dark"] nav button[aria-current="true"]{color:#15162b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-current="true"]{color:#15162b}}

/* ====== CONTENEDOR ====== */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 80px;max-width:1220px;margin:0 auto}
.lede{max-width:68ch;color:var(--fg-soft)}
.eyebrow{font-family:var(--font-ui);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c-term)}
.sechead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.sechead h2{font-size:clamp(1.6rem,4.4vw,2.3rem);font-weight:800}

/* ====== ÍNDICE + TEMA ====== */
.cols{display:grid;grid-template-columns:252px minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:18px}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;gap:3px;min-width:0}
.toc button{display:flex;gap:9px;align-items:flex-start;font-family:var(--font-ui);font-size:.88rem;font-weight:700;text-align:left;background:none;border:1px solid transparent;color:var(--fg-soft);padding:9px 11px;border-radius:8px;cursor:pointer;min-width:0;line-height:1.3}
.toc button .tn{font-variant-numeric:tabular-nums;color:var(--c-num);flex:none}
.toc button .tl{min-width:0;overflow-wrap:break-word;hyphens:auto}
.toc button:hover{color:var(--fg);background:var(--surface-2)}
.toc button[aria-current="true"]{color:var(--c-term);background:var(--c-term-bg);border-color:var(--c-term)}
.toc button[aria-current="true"] .tn{color:var(--c-term)}
@media (max-width:900px){
 .toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
 .toc button{white-space:nowrap;flex:none;border:1px solid var(--line)}
 .toc button .tl{overflow-wrap:normal}
}
.topic{min-width:0}
.topic h3{font-size:clamp(1.45rem,3.6vw,1.85rem);font-weight:800;margin-bottom:5px}
.topic .ra{font-family:var(--font-ui);font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c-num);margin-bottom:3px}
.topic .sub-ra{font-size:.95rem;color:var(--fg-soft);max-width:68ch;margin-bottom:4px}
.block{margin-top:30px;max-width:78ch}
.block > h4{font-family:var(--font-ui);font-size:1.12rem;font-weight:800;letter-spacing:-.01em;color:var(--fg);padding-bottom:8px;border-bottom:2px solid var(--c-term);margin-bottom:14px}
.block ul{margin:0 0 .6em;padding-left:1.25em}
.block li{margin-bottom:9px}
.block li::marker{color:var(--c-num)}
.sub{font-family:var(--font-ui);font-size:.82rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft);margin:18px 0 9px}
ol.steps{padding-left:1.45em;margin:0 0 .6em}
ol.steps li{margin-bottom:9px}
ol.steps li::marker{font-family:var(--font-ui);font-weight:800;color:var(--c-num)}

/* ====== TABLAS ====== */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:16px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:380px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
th{font-family:var(--font-ui);font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-soft);background:var(--surface-2);border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--c-num);font-weight:700}

/* ====== AVISOS ====== */
.note{border-radius:10px;padding:14px 16px;margin:18px 0;font-size:.97rem;border:1px solid;border-left-width:4px}
.note .lbl{font-family:var(--font-ui);font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;display:block;margin-bottom:6px}
.note :last-child{margin-bottom:0}
.tip{background:var(--c-si-bg);border-color:var(--c-si)}.tip .lbl{color:var(--c-si)}
.trap{background:var(--c-no-bg);border-color:var(--c-no)}.trap .lbl{color:var(--c-no)}
.form{background:var(--c-def-bg);border-color:var(--c-def)}.form .lbl{color:var(--c-def)}
.form .eq{font-family:var(--font-mono);font-size:1.02rem;font-weight:600;display:block;margin:10px 0;padding:8px 11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow-x:auto;color:var(--fg)}
.note pre{background:var(--surface);margin:10px 0}

/* ====== GLOSARIO ====== */
.search{width:100%;max-width:440px;font-family:var(--font-body);font-size:1rem;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg)}
.glist{display:grid;gap:11px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gitem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c-term);border-radius:9px;padding:13px 15px;min-width:0}
.gitem dt{font-family:var(--font-ui);font-weight:800;font-size:1rem;margin-bottom:4px;color:var(--c-term)}
.gitem dd{margin:0;font-size:.94rem;color:var(--fg)}
.gitem .tag{font-family:var(--font-ui);font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c-num);display:block;margin-top:8px}

/* ====== FLASHCARDS ====== */
.fcwrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c-term);border-radius:14px;padding:32px 26px;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:16px;cursor:pointer;text-align:center}
.card .q{font-family:var(--font-ui);font-size:1.3rem;font-weight:800;letter-spacing:-.015em}
.card .a{font-size:1.02rem;border-top:1px solid var(--line);padding-top:16px;text-align:left;line-height:1.6}
.card .hintflip{font-family:var(--font-ui);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--font-ui);font-size:.88rem;font-weight:700;padding:10px 17px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--c-term);color:var(--c-term)}
.btn.primary{background:var(--c-term);border-color:var(--c-term);color:var(--bg)}
:root[data-theme="dark"] .btn.primary{color:#15162b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#15162b}}
.btn.primary:hover{opacity:.88;color:var(--bg)}
:root[data-theme="dark"] .btn.primary:hover{color:#15162b}
.btn:disabled{opacity:.42;cursor:default}
.meta{font-family:var(--font-ui);font-size:.82rem;font-weight:600;color:var(--fg-soft);text-align:center;font-variant-numeric:tabular-nums}

/* ====== SIMULACRO ====== */
.examintro{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:18px 0 22px}
.part{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c-num);border-radius:11px;padding:16px}
.part .n{font-family:var(--font-ui);font-size:2.1rem;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:var(--c-num)}
.part .t{font-family:var(--font-ui);font-weight:800;font-size:.96rem;margin-top:6px}
.part .p{font-size:.88rem;color:var(--fg-soft);line-height:1.45}
.q{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:17px 19px;margin-bottom:12px}
.qhead{display:flex;gap:11px;align-items:baseline;margin-bottom:12px}
.qnum{font-family:var(--font-ui);font-size:.76rem;font-weight:800;color:var(--c-num);background:var(--c-num-bg);border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.qtext{font-weight:600;min-width:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.97rem;background:var(--bg)}
.opt:hover{border-color:var(--c-term)}
.opt input{margin:5px 0 0;flex:none;accent-color:var(--c-term)}
.opt.good{background:var(--c-si-bg);border-color:var(--c-si)}
.opt.bad{background:var(--c-no-bg);border-color:var(--c-no)}
textarea{width:100%;font-family:var(--font-body);font-size:1rem;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical;min-height:84px}
.sol{margin-top:13px;background:var(--surface-2);border-left:4px solid var(--c-si);border-radius:0 9px 9px 0;padding:13px 15px;font-size:.96rem}
.sol .lbl{font-family:var(--font-ui);font-size:.7rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--c-si);display:block;margin-bottom:6px}
.selfrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.selfrow .lab{font-family:var(--font-ui);font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-soft);margin-right:3px}
.sbtn{font-family:var(--font-ui);font-size:.82rem;font-weight:700;padding:6px 13px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg-soft);cursor:pointer}
.sbtn[aria-pressed="true"]{color:var(--bg);border-color:transparent}
:root[data-theme="dark"] .sbtn[aria-pressed="true"]{color:#15162b}
.sbtn.s1[aria-pressed="true"]{background:var(--c-si)}
.sbtn.s05[aria-pressed="true"]{background:var(--c-def)}
.sbtn.s0[aria-pressed="true"]{background:var(--c-no)}
.partbar{font-family:var(--font-ui);font-weight:800;font-size:1.18rem;letter-spacing:-.015em;margin:34px 0 14px;padding-bottom:9px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.partbar span{font-size:.82rem;font-weight:700;color:var(--c-num);letter-spacing:0}
.scorecard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c-term);border-radius:13px;padding:24px;margin:20px 0;text-align:center}
.scorecard .big{font-family:var(--font-ui);font-size:3.6rem;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:var(--c-term)}
.scorecard .lbl{font-family:var(--font-ui);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-soft)}
.brk{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-family:var(--font-ui);font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.brk div{color:var(--fg-soft)}
.brk b{display:block;font-size:1.3rem;color:var(--c-num);font-weight:800}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:26px -100vw 0;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.sticky-inner{max-width:1220px;margin:0 auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hidden{display:none}
.pill{display:inline-block;font-family:var(--font-ui);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--c-term-bg);color:var(--c-term);margin-bottom:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><span class="dot"></span>Seguridad Informática · RA1</div>
    <div class="count" id="countdown">Examen: lunes</div>
    <div class="tools">
      <button class="iconbtn" id="fsdown" title="Letra más pequeña">A−</button>
      <button class="iconbtn" id="fsup" title="Letra más grande">A+</button>
      <button class="iconbtn" id="themebtn">Tema</button>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"></main>

<script>
/* ============ TEMARIO ============ */
const TEMAS = [
{id:"t1", short:"Introducción", n:1, title:"Introducción a la seguridad informática", ra:"Conceptos base · CIDAN · amenaza, vulnerabilidad y riesgo", blocks:[
 {h:"Qué es y qué protegemos", html:`<ul>
 <li>La <b>seguridad informática</b> es el conjunto de <span class='def'>herramientas, técnicas, procedimientos, dispositivos y políticas</span> destinados a proteger los sistemas y la información. Memoriza los cinco: es una definición de enunciado.</li>
 <li>La información es uno de los <b>activos más valiosos</b> de cualquier organización.</li>
 <li>Qué debemos proteger: <b>información, hardware, software, redes y usuarios</b>.</li>
 <li>Sin medidas sufrimos: robo de información, pérdida de datos, interrupción de servicios, fraudes y suplantaciones, pérdidas económicas y daños reputacionales.</li></ul>`},
 {h:"Modelo CIDAN — los 5 objetivos", html:`<div class="tw"><table><thead><tr><th>Objetivo</th><th>Garantiza que…</th><th>Ejemplos del temario</th></tr></thead><tbody>
 <tr><td><span class="k">Confidencialidad</span></td><td>solo las personas <b>autorizadas</b> acceden a la información</td><td>contraseñas, cifrado, control de acceso, certificados digitales</td></tr>
 <tr><td><span class="k">Integridad</span></td><td>los datos <span class='no'>no se modifican</span> de forma no autorizada</td><td>funciones hash, copias de seguridad, control de cambios</td></tr>
 <tr><td><span class="k">Disponibilidad</span></td><td>sistemas y datos están <b>accesibles cuando se necesitan</b></td><td>SAI, RAID, sistemas redundantes, alta disponibilidad</td></tr>
 <tr><td><span class="k">Autenticidad</span></td><td>se puede <b>comprobar la identidad</b> de usuarios y sistemas</td><td>identificación digital, firma electrónica, biometría</td></tr>
 <tr><td><span class="k">No repudio</span></td><td><b>nadie puede negar</b> haber realizado una acción</td><td>firma electrónica, certificados digitales, acuses de recibo</td></tr>
 </tbody></table></div>
 <ul><li>La autenticidad se consigue en ocasiones gracias a <b>terceras partes confiables (TTP, Trusted Third Party)</b>.</li>
 <li>El no repudio tiene <b>dos tipos</b>: <b>de origen</b> (el emisor no puede negar que lo envió) y <b>de destino</b> (el receptor no puede negar que lo recibió).</li></ul>`},
 {h:"Amenaza, vulnerabilidad y riesgo", html:`<div class="tw"><table><thead><tr><th>Término</th><th>Definición exacta</th></tr></thead><tbody>
 <tr><td><span class="k">Amenaza</span></td><td>Algo (o alguien) <b>capaz de causar daño</b>; el agente con capacidad e intención de causar un daño.</td></tr>
 <tr><td><span class="k">Vulnerabilidad</span></td><td><b>Debilidad</b> de un sistema.</td></tr>
 <tr><td><span class="k">Riesgo</span></td><td><span class='def'>Probabilidad de que una amenaza aproveche una vulnerabilidad.</span></td></tr>
 </tbody></table></div>
 <div class="note tip"><span class="lbl">Caso resuelto en clase · 0-day</span>“Un atacante externo afecta un servidor usando una vulnerabilidad de 0 day”.<br><b>Amenaza:</b> el atacante externo, que tiene capacidad e intención de causar daño. <b>Vulnerabilidad:</b> el fallo 0-day, una debilidad desconocida para la que aún no existe parche en el momento del ataque. <b>Riesgo:</b> la posibilidad de que ese atacante aproveche la vulnerabilidad y consiga acceso no autorizado, robo o modificación de datos, instalación de malware…</div>`},
 {h:"Tips de este tema", html:`<div class="note trap"><span class="lbl">Trampas típicas</span><ul>
 <li>No confundas amenaza con vulnerabilidad: la amenaza es <b>externa y activa</b>, la vulnerabilidad es <b>interna y pasiva</b> (una debilidad propia). El riesgo <b>no es un hecho, es una probabilidad</b>.</li>
 <li>El hash protege la <b>integridad</b>, no la confidencialidad. Cifrar protege la <b>confidencialidad</b>.</li>
 <li>La firma electrónica cubre <b>autenticidad, integridad y no repudio</b> a la vez; es la respuesta más completa cuando aparece.</li>
 <li>¿Es posible la seguridad total? <span class='no'>No.</span> Se reduce el riesgo a un nivel aceptable, nunca a cero.</li></ul></div>`}
]},

{id:"t2", short:"Tipos de seguridad", n:2, title:"Tipos de seguridad", ra:"Políticas · plan de contingencia · auditorías · clasificación", blocks:[
 {h:"Cómo evitar los riesgos", html:`<ul>
 <li><b>Personalmente:</b> buenas prácticas y sentido común.</li>
 <li><b>En la empresa:</b> políticas de seguridad, planes de contingencia y <b>auditorías</b>.</li></ul>`},
 {h:"Políticas de seguridad", html:`<p>Son <b>normas y protocolos</b> que deben seguir los responsables de la seguridad para proteger los sistemas informáticos <b>a nivel físico y lógico</b>.</p>
 <h4 class="sub">Medidas preventivas (12 del temario)</h4>
 <ol class="steps"><li>Localizar <b>todos los activos</b> que hay que proteger.</li>
 <li>Revisar la configuración de las <b>copias de seguridad</b>.</li>
 <li>Elaborar <b>planes de actuación ante catástrofes</b> (planes de contingencia).</li>
 <li>Instalar <b>lo estrictamente necesario</b> e impedir que los usuarios instalen sin permiso.</li>
 <li>Estar al día sobre seguridad: formación y suscripción a foros, sobre todo de los <b>proveedores de hardware y software</b>, para conocer los agujeros de seguridad.</li>
 <li>Mantener el <b>sistema operativo y las aplicaciones actualizadas</b>.</li>
 <li>Dar <b>formación a los usuarios</b>.</li>
 <li>Revisar los archivos <code>.log</code> del sistema para detectar problemas.</li>
 <li>Revisar la <b>lista de equipos conectados</b>.</li>
 <li>Revisar los <b>usuarios activos</b> y eliminar los que ya no están en la empresa.</li>
 <li>Configurar el <b>aviso por SMS</b> ante fallo eléctrico (algunos SAI lo traen).</li>
 <li>Realizar <b>auditorías periódicas</b>.</li></ol>
 <h4 class="sub">Medidas correctivas (tras el desastre)</h4>
 <ol class="steps"><li>Reparación de equipos dañados y sustitución de piezas.</li>
 <li>Reinstalación de software.</li>
 <li>Recuperación de datos mediante <b>copias de seguridad</b>.</li>
 <li>Bloqueo de cuentas de usuarios negligentes.</li></ol>`},
 {h:"Plan de contingencia — las 5 etapas", html:`<p>Aunque apliquemos todas las políticas, a veces se producen fallos que llevan al desastre. El plan de contingencia permite <b>recuperarse</b> y corregir problemas.</p>
 <div class="tw"><table><thead><tr><th>#</th><th>Etapa</th><th>En qué consiste</th></tr></thead><tbody>
 <tr><td class="num">1</td><td><span class="k">Evaluación</span></td><td>Identificar los <b>activos críticos</b> y analizar el <b>impacto</b> que tendría su deterioro o pérdida.</td></tr>
 <tr><td class="num">2</td><td><span class="k">Planificación</span></td><td><b>Documentar y validar</b> el plan. Intervienen los miembros que se verían afectados por el desastre.</td></tr>
 <tr><td class="num">3</td><td><span class="k">Pruebas</span></td><td>Se <b>simula un entorno de prueba</b> para comprobar la <b>viabilidad</b> del plan.</td></tr>
 <tr><td class="num">4</td><td><span class="k">Ejecución</span></td><td>El plan <b>se pone en marcha</b> para asegurar la continuidad del sistema en caso de fallo.</td></tr>
 <tr><td class="num">5</td><td><span class="k">Recuperación</span></td><td>Tras el incidente se <b>restablece el sistema</b> para que continúe como si nada hubiese pasado.</td></tr>
 </tbody></table></div>
 <div class="note tip"><span class="lbl">Regla para memorizar</span><b>E-P-P-E-R</b> → <b>E</b>valuación · <b>P</b>lanificación · <b>P</b>ruebas · <b>E</b>jecución · <b>R</b>ecuperación. Si te piden elaborar un plan de contingencia, usa estas cinco como apartados y en este orden.</div>`},
 {h:"Auditorías", html:`<ul>
 <li>Una auditoría es una <b>evaluación sistemática sobre un objeto</b>. En seguridad informática, sobre las <b>políticas, protocolos, planes de contención y dispositivos</b> que conforman la red de la entidad.</li>
 <li><b>Interna:</b> la realiza la propia empresa. <b>Externa:</b> se contrata a una empresa de fuera.</li>
 <li>Por norma general, las <span class='si'>más completas son las externas</span> (más objetividad e independencia).</li>
 <li>En ocasiones la entidad auditora emite un <b>certificado</b> que demuestra el cumplimiento de los criterios de seguridad.</li></ul>`},
 {h:"Clasificación de la seguridad", html:`<p>Se clasifica <b>de dos formas a la vez</b>, y en el examen casi siempre te piden las dos.</p>
 <div class="tw"><table><thead><tr><th colspan="2">Según QUÉ se protege</th></tr></thead><tbody>
 <tr><td><span class="k">Física</span></td><td>Protege cada <b>dispositivo o el CPD</b>: equipos, servidores, cableado, infraestructuras. Frente a <b>incendios, robos, inundaciones, cortes eléctricos</b>, apagones y meteorología.</td></tr>
 <tr><td><span class="k">Lógica</span></td><td>Protege el <b>software</b>: datos, aplicaciones, sistemas operativos y comunicaciones. Frente a <b>malware, accesos no autorizados y manipulación de información</b>. Se guía por el modelo CIDAN.</td></tr>
 </tbody></table></div>
 <div class="tw"><table><thead><tr><th colspan="2">Según CUÁNDO actúa</th></tr></thead><tbody>
 <tr><td><span class="k">Activa</span></td><td>Medidas de protección <b>en las interacciones usuario-sistema</b>. Carácter <b>proactivo</b>: previene y detecta <b>antes</b> de que suceda el ataque. Contraseñas, encriptación, firmas y certificados digitales.</td></tr>
 <tr><td><span class="k">Pasiva</span></td><td>Protege el sistema <b>simplemente por existir</b>. <b>Soluciona o minimiza</b> los efectos de un ataque <b>ya producido</b>. Copias de seguridad, RAID y SAI.</td></tr>
 </tbody></table></div>
 <div class="tw"><table><thead><tr><th>Seguridad activa</th><th>Seguridad pasiva</th></tr></thead><tbody>
 <tr><td>Previene</td><td>Recupera</td></tr><tr><td>Detecta</td><td>Minimiza daños</td></tr>
 <tr><td>Antivirus</td><td>Backup</td></tr><tr><td>Firewall</td><td>RAID</td></tr><tr><td>ACL</td><td>SAI</td></tr>
 </tbody></table></div>
 <div class="note trap"><span class="lbl">Ojo con esto</span>Los dos criterios son <b>independientes</b>: toda medida es (física o lógica) <b>y</b> (activa o pasiva). Un SAI es <b>física + pasiva</b>; un antivirus es <b>lógica + activa</b>; un lector de huella para encender el PC es <b>lógica + activa</b> (controla la interacción usuario-sistema, aunque el lector sea un aparato); generar un SHA-1 es <b>lógica + pasiva</b> (no impide nada, solo permite comprobar después).</div>`}
]},

{id:"t3", short:"Seguridad pasiva", n:3, title:"Seguridad pasiva: ubicación y protección física", ra:"RA1 · CE c, CE d · riesgos físicos y CPD", blocks:[
 {h:"De qué se ocupa la seguridad física", html:`<ul>
 <li>Empieza con el <b>control de acceso</b> a las salas o al edificio.</li>
 <li>Incluye el <b>mantenimiento</b> de las instalaciones y del hardware.</li>
 <li>Y es la encargada de la <b>recuperación ante la pérdida de equipo</b> por desastres.</li>
 <li>Idea clave del tema: <b>ningún plan de contención es infalible</b>.</li></ul>`},
 {h:"Riesgos a nivel físico (los 6 del temario)", html:`<div class="tw"><table><thead><tr><th>Riesgo</th><th>Ejemplos</th></tr></thead><tbody>
 <tr><td><span class="k">Obsolescencia de almacenamiento</span></td><td>deterioro de cintas, discos, HD…</td></tr>
 <tr><td><span class="k">Fenómenos naturales</span></td><td>riadas, terremotos, incendios, tormentas eléctricas</td></tr>
 <tr><td><span class="k">Problemas eléctricos</span></td><td>subidas y picos de tensión, apagones</td></tr>
 <tr><td><span class="k">Problemas electromagnéticos</span></td><td>imanes, altavoces, destornilladores imantados</td></tr>
 <tr><td><span class="k">Riesgos humanos involuntarios</span></td><td>café derramado, puertas abiertas</td></tr>
 <tr><td><span class="k">Riesgos humanos deliberados</span></td><td>sabotajes, vandalismo, robos</td></tr>
 </tbody></table></div>`},
 {h:"Instalaciones que hay que proteger y mantener", html:`<ul>
 <li><b>Instalación eléctrica:</b> enchufes con <b>toma a tierra</b>.</li>
 <li><b>Instalaciones de red:</b> dispositivos como <b>routers y switches cerrados con llave</b> para controlar el acceso.</li>
 <li><b>Instalación contra incendios:</b> <b>detectores de humo o calor</b> y aspersores con <b>nebulización de agua, gases inertes o CO₂</b>.</li></ul>`},
 {h:"El CPD (Centro de Procesamiento de Datos)", html:`<p>Centraliza <b>servidores y equipos críticos</b>.</p>
 <h4 class="sub">Ventajas de centralizar</h4>
 <ul><li><b>Ahorro en vigilancia y refrigeración</b>: un solo punto que proteger.</li>
 <li><b>Mejores comunicaciones</b> entre servidores.</li>
 <li><b>Recursos humanos</b> del departamento IT más eficientes.</li></ul>
 <h4 class="sub">Estructura y condiciones</h4>
 <ul><li>Varios servidores con <b>hardware potente apilados en racks</b>, unidos por cableado y elementos de interconexión.</li>
 <li>Funciona <b>24 horas al día</b>.</li>
 <li>Se ubica en <b>edificios o salas independientes, lejos de los puestos de usuario</b>: hacen <b>mucho ruido</b> y <b>desprenden mucho calor</b>.</li>
 <li><b>Temperatura interior: 17-19 °C</b> → hace falta un sistema de refrigeración muy potente.</li>
 <li>Debe tener un <b>sistema anexo de copias de seguridad</b>.</li>
 <li>Elementos del diagrama: <b>grupo electrógeno, servidores, refrigeración, backups, SAIs y sala de control</b>.</li></ul>`},
 {h:"Centros de respaldo", html:`<p>Son <b>réplicas casi exactas del CPD</b> para recuperar rápidamente el sistema ante un desastre. Suelen estar <b>alejados del CPD original</b> y se usan sobre todo cuando la empresa <b>no puede permitirse tener los servidores inactivos</b>.</p>
 <ul><li><b>Réplicas exactas</b> del CPD.</li><li><b>Réplicas parciales</b> del CPD original.</li>
 <li><b>Acuerdo mutuo</b>: dos empresas se respaldan la una a la otra.</li></ul>`},
 {h:"Medidas según la ubicación", html:`<div class="tw"><table><thead><tr><th>Salas dentro de la empresa</th><th>Edificios aislados</th></tr></thead><tbody>
 <tr><td>Sala <b>reforzada arquitectónicamente</b> (soporta mucho peso)</td><td>Zonas con <b>poco riesgo</b> de terremotos, inundaciones e incendios</td></tr>
 <tr><td>Preferentemente en <b>plantas bajas</b></td><td><b>Lejos de otros edificios</b></td></tr>
 <tr><td><span class='no'>Evitar los sótanos</span> a ser posible</td><td>En <b>zonas frías</b>, para reducir el consumo energético</td></tr>
 <tr><td><b>Sin material inflamable</b> en salas alrededor</td><td>Estructura <b>ignífuga</b> y control de acceso <b>más riguroso</b></td></tr>
 </tbody></table></div>
 <div class="note trap"><span class="lbl">Pregunta de reflexión que puede caer</span>“¿Las empresas eligen la ubicación más segura o la más rentable?” → En la práctica pesa mucho el <b>coste</b> (terreno barato, electricidad barata, clima frío que abarata la refrigeración) y por eso a veces se asumen riesgos; lo correcto es un <b>equilibrio</b> justificado con un análisis de riesgos.</div>`}
]},
{id:"t4", short:"ACL", n:4, title:"Listas de control de acceso (ACL)", ra:"RA1 · CE g · ¿quién puede hacer qué, sobre qué?", blocks:[
 {h:"Control de acceso y las 3 fases (IAA)", html:`<p>El control de acceso es el conjunto de mecanismos que <span class='def'>permiten o deniegan</span> a un <b>sujeto</b> realizar una <b>operación</b> sobre un <b>objeto</b>.</p>
 <ol class="steps"><li><b>Identificación</b> — ¿quién dices ser? (usuario)</li>
 <li><b>Autenticación</b> — demuéstralo (contraseña, tarjeta, huella)</li>
 <li><b>Autorización</b> — ¿qué puedes hacer? <b>Aquí actúan las ACL</b></li></ol>
 <ul><li><b>Sujeto:</b> usuario, grupo, proceso, equipo.</li>
 <li><b>Objeto:</b> fichero, carpeta, impresora, puerto, sala.</li>
 <li><b>Operación / permiso:</b> leer, escribir, ejecutar, borrar, entrar…</li></ul>`},
 {h:"Matriz de control de acceso", html:`<p>Es la forma <b>más completa</b> de representar quién puede hacer qué. En una empresa real es <b>enorme y casi vacía</b> (miles de sujetos × miles de objetos, la mayoría de celdas en “—”), así que <span class='no'>no se guarda entera</span>, sino <b>por columnas</b> (ACL) o <b>por filas</b> (capacidades).</p>
 <div class="tw"><table><thead><tr><th>Sujeto \\ Objeto</th><th>nominas.xlsx</th><th>clientes.db</th><th>Impresora 1</th><th>Sala CPD</th></tr></thead><tbody>
 <tr><td>Ana (RR. HH.)</td><td>Leer, Escribir</td><td>—</td><td>Imprimir</td><td>—</td></tr>
 <tr><td>Luis (Comercial)</td><td>—</td><td>Leer, Escribir</td><td>Imprimir</td><td>—</td></tr>
 <tr><td>Marta (Técnica)</td><td>—</td><td>Leer</td><td>Imprimir</td><td>Entrar</td></tr>
 <tr><td>Becario</td><td>—</td><td>Leer</td><td>—</td><td>—</td></tr>
 </tbody></table></div>`},
 {h:"ACL frente a listas de capacidades", html:`<div class="tw"><table><thead><tr><th></th><th>ACL (por columnas)</th><th>Capacidades (por filas)</th></tr></thead><tbody>
 <tr><td>Qué guarda</td><td>Cada <b>objeto</b> guarda la lista de quién puede hacer qué con él</td><td>Cada <b>sujeto</b> guarda lo que puede hacer</td></tr>
 <tr><td>Ventaja</td><td>Fácil saber <b>quién accede a un recurso</b> y fácil <b>revocar</b> el acceso a ese recurso</td><td>Fácil saber <b>todo lo que puede hacer un usuario</b></td></tr>
 <tr><td>Inconveniente</td><td>Difícil saber todo lo que puede hacer un usuario</td><td>Difícil revocar un recurso <b>a todos</b></td></tr>
 </tbody></table></div>
 <p>Cada línea de una ACL es una <b>ACE</b> (<i>Access Control Entry</i>): <b>sujeto + permiso + permitir o denegar</b>.</p>
 <pre>nominas.xlsx            Ana
├── Ana → Leer, Escribir   ├── nominas.xlsx → Leer, Escribir
└── Grupo RRHH → Leer      └── Impresora 1 → Imprimir
   (ACL: por objeto)          (capacidades: por sujeto)</pre>`},
 {h:"Los 6 principios de cualquier ACL", html:`<div class="tw"><table><thead><tr><th>Principio</th><th>Qué significa</th></tr></thead><tbody>
 <tr><td><span class="k">Mínimo privilegio</span></td><td>Cada sujeto tiene <b>solo los permisos imprescindibles</b> para su trabajo</td></tr>
 <tr><td><span class="k">Necesidad de saber</span></td><td>Solo se accede a la información <b>que hace falta para la tarea</b></td></tr>
 <tr><td><span class="k">Denegar por defecto</span></td><td>Lo que no está <b>permitido explícitamente</b> está prohibido</td></tr>
 <tr><td><span class="k">Segregación de funciones</span></td><td>Una tarea crítica no depende de una sola persona: <b>quien pide no aprueba</b></td></tr>
 <tr><td><span class="k">Permisos a grupos, no a personas</span></td><td>Se asignan a <b>roles o grupos</b>; las personas entran y salen de ellos</td></tr>
 <tr><td><span class="k">Trazabilidad</span></td><td>Cuentas <b>personales e intransferibles</b> y accesos <b>registrados</b></td></tr>
 </tbody></table></div>`},
 {h:"Modelos de control de acceso", html:`<div class="tw"><table><thead><tr><th></th><th>DAC</th><th>MAC</th><th>RBAC</th><th>ABAC</th></tr></thead><tbody>
 <tr><td>Nombre</td><td>Discrecional</td><td>Obligatorio</td><td>Basado en roles</td><td>Basado en atributos</td></tr>
 <tr><td><b>¿Quién decide?</b></td><td><b>Propietario</b> del recurso</td><td><b>Sistema</b>, según etiquetas</td><td><b>Administrador</b> (roles)</td><td><b>Reglas</b> sobre atributos</td></tr>
 <tr><td>Flexibilidad</td><td>Alta</td><td>Muy baja</td><td>Media</td><td>Muy alta</td></tr>
 <tr><td>Seguridad</td><td>Baja o media</td><td>Muy alta</td><td>Alta</td><td>Alta</td></tr>
 <tr><td>Administración</td><td>Sencilla, caótica a gran escala</td><td>Costosa</td><td>Sencilla</td><td>Compleja</td></tr>
 <tr><td>Uso típico</td><td>Ficheros personales, nube, Windows y Linux</td><td>Defensa, gobierno, <b>SELinux</b></td><td>Empresas, <b>ERP, Active Directory</b></td><td>Nube, accesos con condiciones</td></tr>
 </tbody></table></div>
 <ul><li><b>MAC:</b> decide por <b>nivel de clasificación</b> del recurso y <b>habilitación</b> del usuario. <b>Ni el propietario puede saltárselo.</b></li>
 <li><b>RBAC:</b> los permisos se asignan a roles y los usuarios tienen roles. Altas, bajas y cambios de puesto muy sencillos; hay que evitar la <b>“explosión de roles”</b>.</li>
 <li><b>ABAC:</b> atributos del usuario, del recurso y del <b>contexto</b> (hora, ubicación, dispositivo). Ejemplo: “enfermería puede ver historiales <b>de su planta</b>, en <b>su turno</b>, desde un <b>equipo del hospital</b>”.</li>
 <li>En la práctica se <b>combinan</b>: RBAC como base + condiciones ABAC para casos concretos (turnos, teletrabajo).</li></ul>`},
 {h:"ACL en Linux: permisos clásicos", html:`<pre>$ ls -l informe.odt
-rw-r----- 1 ana contabilidad 24576 sep 28 10:12 informe.odt
 │└┬┘└┬┘└┬┘   └┬┘ └────┬─────┘
 │ │  │  │     │       └── grupo propietario
 │ │  │  │     └────────── usuario propietario
 │ │  │  └── otros: --- (nada)
 │ │  └───── grupo: r-- (leer)
 │ └──────── usuario: rw- (leer y escribir)
 └────────── tipo: - fichero, d directorio</pre>
 <div class="tw"><table><thead><tr><th>Permiso</th><th>Símbolo</th><th>Sobre archivos</th><th>Sobre directorios</th></tr></thead><tbody>
 <tr><td>Lectura</td><td class="mono">r</td><td>Ver el contenido</td><td>Ver <b>qué archivos contiene</b></td></tr>
 <tr><td>Escritura</td><td class="mono">w</td><td>Modificar el contenido</td><td><b>Crear, eliminar o renombrar</b> archivos</td></tr>
 <tr><td>Ejecución</td><td class="mono">x</td><td>Ejecutar el archivo como programa</td><td><b>Acceder / entrar</b> al directorio</td></tr>
 </tbody></table></div>
 <p>Si Pedro no está en el grupo <i>contabilidad</i>, <span class='no'>no puede</span> leerlo sin cambiarlo de grupo o abrirlo a todos → la solución son las <b>ACL POSIX</b>.</p>`},
 {h:"ACL POSIX y la máscara", html:`<pre>setfacl -m u:pedro:r informe.odt      # añade a Pedro con lectura
setfacl -m g:auditoria:r informe.odt  # añade un grupo más
setfacl -x u:pedro informe.odt        # quita a Pedro
getfacl informe.odt                   # muestra la ACL</pre>
 <pre># file: informe.odt
# owner: ana
# group: contabilidad
user::rw-
user:pedro:r--
group::r--
group:auditoria:r--
mask::r--          ← límite máximo de usuarios y grupos añadidos
other::---</pre>
 <div class="note form"><span class="lbl">La máscara: la clave de los ejercicios</span>La <b>máscara recorta los permisos efectivos</b> de todo lo que no sea el <b>propietario</b> (<code>user::</code>) ni <b>“otros”</b> (<code>other::</code>).<span class="eq">permiso efectivo = permiso asignado AND máscara</span>El propietario y “otros” <b>se saltan la máscara</b>. Todos los demás (usuarios nombrados, grupo propietario y grupos nombrados) quedan limitados por ella.</div>`},
 {h:"ACL en Windows: permisos NTFS", html:`<ul>
 <li>Cada fichero y carpeta tiene una ACL con entradas <span class='si'>Permitir</span> o <b>Denegar</b> para usuarios y grupos.</li>
 <li>Permisos básicos: <b>Control total · Modificar · Leer y ejecutar · Mostrar contenido · Leer · Escribir</b>.</li>
 <li><b>Herencia:</b> las carpetas pasan sus permisos a lo que contienen.</li></ul>
 <div class="note form"><span class="lbl">Orden de evaluación (de más a menos prioridad)</span>
 <ol class="steps" style="margin:6px 0 0"><li><b>Denegar explícito</b></li><li><b>Permitir explícito</b></li><li><b>Denegar heredado</b></li><li><b>Permitir heredado</b></li></ol>
 <p style="margin:10px 0 0"><b>Carpeta compartida por red:</b> se combinan los permisos de <b>recurso compartido</b> y los <b>NTFS</b>, y <b>gana el más restrictivo</b>. Si entras <b>sentado en el propio servidor</b> (acceso local), el permiso de recurso compartido <span class='no'>no se aplica</span>: solo cuentan los NTFS.</p></div>`},
 {h:"ACL de red: filtrar tráfico", html:`<pre>10  permit tcp 192.168.10.0/24  any                      eq 443
20  deny  tcp any                host 192.168.20.5 eq 22
30  permit tcp host 192.168.10.50 host 192.168.20.5 eq 22
40  permit icmp any any
XX  implicit deny any</pre>
 <ul><li><span class='n'>10 —</span> permite TCP desde cualquier equipo de esa red hacia cualquier destino en el <b>puerto 443 (HTTPS)</b>.</li>
 <li><span class='n'>20 —</span> bloquea cualquier conexión TCP dirigida a 192.168.20.5 en el <b>puerto 22 (SSH)</b>.</li>
 <li><span class='n'>30 —</span> permite que 192.168.10.50 se conecte por TCP al puerto 22 de 192.168.20.5.</li>
 <li><span class='n'>40 —</span> permite <b>ICMP</b> de cualquier origen a cualquier destino (es decir, permite <b>pings</b>).</li></ul>
 <div class="note form"><span class="lbl">Las 4 reglas de oro</span>
 <ol class="steps" style="margin:6px 0 0"><li>Se evalúan <b>en orden, de arriba abajo</b>.</li>
 <li>Se aplica la <b>primera regla que coincide</b> y <b>se deja de mirar</b>.</li>
 <li>Al final siempre hay un <b>denegar todo implícito</b>.</li>
 <li>Las reglas <b>más específicas van antes</b> que las generales.</li></ol></div>
 <div class="note trap"><span class="lbl">El fallo del ejemplo (cae seguro)</span>El administrador <b>192.168.10.50 no puede entrar por SSH</b> aunque la regla 30 se lo permita: la regla <b>20 deniega antes</b> y, al coincidir primero, ya no se sigue leyendo. <b>Solución:</b> poner la regla 30 (la más específica) <b>antes</b> de la 20 — por ejemplo renumerándola como 15.</div>`},
 {h:"Las ACL también son físicas", html:`<div class="tw"><table><thead><tr><th>Zona</th><th>Quién</th><th>Cuándo</th><th>Cómo</th></tr></thead><tbody>
 <tr><td>Entrada principal</td><td>Todo el personal</td><td>7:00 – 21:00</td><td>Tarjeta</td></tr>
 <tr><td>Oficinas</td><td>Personal de la planta</td><td>Horario laboral</td><td>Tarjeta</td></tr>
 <tr><td>CPD</td><td>Técnicos de sistemas</td><td>24/7</td><td><b>Tarjeta + huella</b></td></tr>
 <tr><td>CPD (externos)</td><td>Mantenimiento</td><td>Con cita</td><td>Acompañado y registrado</td></tr>
 </tbody></table></div>
 <p>Los sistemas de control de accesos físicos guardan <b>una ACL por puerta</b> (quién, qué zona, qué horario) y un <b>registro de entradas</b>.</p>`},
 {h:"Política de seguridad basada en ACL (los 10 puntos)", html:`<p>Una política <b>no son solo los permisos</b>: es el documento que dice <b>cómo se deciden, se aplican y se revisan</b>.</p>
 <ol class="steps"><li><b>Objetivo y alcance</b>: qué sistemas, qué personas.</li>
 <li><b>Inventario y clasificación de recursos</b>: pública, interna, confidencial, especialmente protegida.</li>
 <li><b>Roles y grupos</b> de usuarios.</li>
 <li><b>Matriz de control de acceso</b>: rol × recurso.</li>
 <li><b>Principios</b>: mínimo privilegio, denegar por defecto, segregación…</li>
 <li><b>Procedimientos</b>: alta, cambio de puesto, baja, externos y temporales.</li>
 <li><b>Revisión periódica</b> de permisos: ¿cada cuánto? ¿quién?</li>
 <li><b>Registro y auditoría</b> de accesos.</li>
 <li><b>Excepciones y emergencias</b>.</li>
 <li><b>Responsables</b> de aprobar y de mantener la política.</li></ol>`},
 {h:"Ciclo de vida del acceso y errores típicos", html:`<p><b>Solicitud → Aprobación</b> (responsable del recurso) <b>→ Asignación</b> (se añade al grupo o rol) <b>→ Uso + registro → Revisión periódica →</b> cambio de puesto (vuelve a solicitud) o <b>revocación</b> en la baja, <b>el mismo día</b>.</p>
 <div class="note trap"><span class="lbl">Errores típicos (y el principio que incumplen)</span><ul>
 <li>Permisos a <b>Todos / Everyone</b> “para que funcione” → mínimo privilegio y denegar por defecto.</li>
 <li><b>Cuentas compartidas</b> (la cuenta <code>admin</code> común) → no hay <span class='si'>trazabilidad</span>.</li>
 <li><b>Acumulación de privilegios</b>: cambia de puesto y conserva los permisos antiguos → mínimo privilegio.</li>
 <li><b>Bajas que no se revocan</b>: cuentas “zombi” → revocación el mismo día.</li>
 <li>Permisos <b>directos a cada usuario</b> según lo pida → permisos a grupos, no a personas.</li>
 <li>Revisar permisos <b>solo cuando hay un incidente</b> → revisión periódica.</li>
 <li>“Todo lo que no esté prohibido está permitido” → <b>denegar por defecto</b>.</li>
 <li>Quien <b>da de alta proveedores aprueba sus pagos</b> → segregación de funciones.</li></ul></div>`}
]},

{id:"t5", short:"Contraseñas", n:5, title:"Política de contraseñas", ra:"RA1 · CE h · la llave que abre todas las puertas", blocks:[
 {h:"Por qué hace falta una política", html:`<ul>
 <li>La contraseña sigue siendo el <b>mecanismo de autenticación más usado</b> en empresas.</li>
 <li>Las <b>credenciales robadas o débiles</b> son una de las principales vías de entrada en los incidentes (informes <b>Verizon DBIR</b> e <b>INCIBE-CERT</b>).</li>
 <li>Las personas <b>reutilizan contraseñas</b>: una filtración en una web cualquiera abre el correo, el banco o el servidor de la empresa.</li>
 <li>Consecuencias: robo de datos (con obligación de <b>notificar a la AEPD</b>), <i>ransomware</i>, fraude, suplantación y daño a la imagen.</li>
 <li><b>Sin política</b> cada persona hace lo que quiere; <b>con política</b> la empresa fija <b>mínimos obligatorios</b>, los <b>implanta técnicamente</b> y <b>forma</b> al personal.</li></ul>`},
 {h:"Cómo se rompen: adivinarlas", html:`<div class="tw"><table><thead><tr><th>Ataque</th><th>En qué consiste</th><th>Defensa principal</th></tr></thead><tbody>
 <tr><td><span class="k">Fuerza bruta</span></td><td>Probar <b>todas</b> las combinaciones posibles</td><td><span class='si'>Longitud</span></td></tr>
 <tr><td><span class="k">Diccionario</span></td><td>Probar palabras y contraseñas conocidas</td><td>Lista negra; no usar palabras ni contraseñas comunes</td></tr>
 <tr><td><span class="k">Reglas o híbrido</span></td><td>Diccionario + variaciones (<code>a→@</code>, <code>+2026</code>, <code>+!</code>)</td><td>No seguir patrones previsibles</td></tr>
 <tr><td><span class="k">Credential stuffing</span></td><td>Usar usuario y contraseña <b>filtrados de otra web</b></td><td>No reutilizar · MFA</td></tr>
 <tr><td><span class="k">Password spraying</span></td><td><b>Pocas</b> contraseñas comunes en <b>muchas</b> cuentas</td><td>Lista negra · detección</td></tr>
 <tr><td><span class="k">Tablas rainbow</span></td><td>Tablas <b>precalculadas</b> de hash → contraseña</td><td><b>Sal</b> en el almacenamiento</td></tr>
 </tbody></table></div>
 <p><b>Online</b> (contra el login): limitado por los bloqueos. <b>Offline</b> (con los hashes robados): <b>miles de millones de intentos por segundo</b>.</p>`},
 {h:"Cómo se roban: sin adivinarlas", html:`<ul>
 <li><b>Phishing:</b> una web o correo falso te la pide.</li>
 <li><b>Keylogger</b> o malware que captura el teclado.</li>
 <li><b>Shoulder surfing:</b> mirar por encima del hombro.</li>
 <li><b>Ingeniería social:</b> “soy de informática, dame tu contraseña para revisar tu cuenta”.</li>
 <li><b>Mala custodia:</b> pósit en el monitor, <code>contraseñas.xlsx</code>, contraseña enviada por WhatsApp.</li>
 <li><b>Contraseñas por defecto:</b> routers, cámaras, impresoras o TPV con <code>admin/admin</code>.</li></ul>
 <p>Una contraseña de 30 caracteres <span class='no'>no protege</span> si se la entregas al atacante: por eso hacen falta <b>MFA y formación</b>.</p>`},
 {h:"Entropía: medir la fuerza", html:`<div class="note form"><span class="lbl">Fórmula de entropía</span><span class="eq">bits = L × log₂(N)</span>
 <b>L</b> = longitud · <b>N</b> = tamaño del alfabeto. <b>Cada bit duplica</b> los intentos necesarios.<br>
 Tiempo para probarlas todas (offline): <span class="eq">t = N^L ÷ (intentos por segundo)</span></div>
 <div class="tw"><table><thead><tr><th>Alfabeto</th><th>N</th><th>bits por carácter</th></tr></thead><tbody>
 <tr><td>Solo dígitos</td><td class="num">10</td><td class="num">3,3</td></tr>
 <tr><td>Minúsculas</td><td class="num">26</td><td class="num">4,7</td></tr>
 <tr><td>Mayúsculas + minúsculas + dígitos</td><td class="num">62</td><td class="num">5,95</td></tr>
 <tr><td>Todos los imprimibles</td><td class="num">94</td><td class="num">6,55</td></tr>
 <tr><td>Palabra de una lista de 7.776 (<i>diceware</i>)</td><td class="num">7.776</td><td class="num">12,9 por palabra</td></tr>
 </tbody></table></div>
 <p>Atacante <b>offline</b> con una GPU actual (RTX 5090): <b>10.000 millones de intentos por segundo (10¹⁰)</b> contra un hash MD5.</p>
 <div class="tw"><table><thead><tr><th>Contraseña aleatoria</th><th>Bits</th><th>Tiempo para probarlas todas</th></tr></thead><tbody>
 <tr><td>4 dígitos (PIN)</td><td class="num">13,3</td><td>instantáneo (1 microsegundo)</td></tr>
 <tr><td>6 minúsculas</td><td class="num">28,2</td><td>0,03 s</td></tr>
 <tr><td>8 caracteres: mayús. + minús. + dígitos</td><td class="num">47,6</td><td>unas <span class='n'>6 horas</span></td></tr>
 <tr><td>8 caracteres de los 94 imprimibles</td><td class="num">52,4</td><td>unos <span class='n'>7 días</span></td></tr>
 <tr><td>12 minúsculas</td><td class="num">56,4</td><td>unos <span class='n'>110 días</span></td></tr>
 <tr><td>6 palabras diceware</td><td class="num">77,5</td><td>unos <span class='n'>700.000 años</span></td></tr>
 </tbody></table></div>
 <div class="note trap"><span class="lbl">La conclusión del tema</span><b>Manda la longitud, no la complejidad.</b> Añadir <b>un carácter</b> suma 4,7-6,5 bits; añadir “un símbolo obligatorio” casi no suma nada, porque la gente lo pone <b>siempre al final</b>. Y la entropía <b>solo vale para contraseñas generadas al azar</b>: una “inventada” por una persona es mucho más débil de lo que dice la fórmula.</div>`},
 {h:"Cómo se guardan: hash y sal", html:`<ul>
 <li><span class='no'>Nunca en texto plano.</span> Se guarda un <b>hash</b>: función <b>de un solo sentido</b>. <code>123456 → MD5 → e10adc3949ba59abbe56e057f20f883e</code></li>
 <li><b>No válidos</b> (demasiado rápidos): <b>MD5, SHA-1, SHA-256 a secas</b>.</li>
 <li><b>Correctos</b> (lentos y diseñados para contraseñas): <span class='si'>Argon2id, bcrypt, scrypt, yescrypt, PBKDF2</span>.</li>
 <li><b>Sal (<i>salt</i>):</b> valor <b>aleatorio distinto para cada usuario</b> que se mezcla con la contraseña.</li></ul>
 <div class="tw"><table><thead><tr><th>Usuario</th><th>Contraseña</th><th>Sin sal</th><th>Con sal</th></tr></thead><tbody>
 <tr><td>ana</td><td>123456</td><td class="mono">e10a…883e</td><td class="mono">$6$Qx7…$Kp2…</td></tr>
 <tr><td>luis</td><td>123456</td><td class="mono">e10a…883e</td><td class="mono">$6$aB9…$Zr8…</td></tr>
 </tbody></table></div>
 <div class="note tip"><span class="lbl">Qué evita la sal</span>Dos contraseñas iguales dan <b>hashes distintos</b>, así que las <b>tablas rainbow dejan de servir</b> y no se ve a simple vista qué usuarios comparten contraseña. Esta es la pregunta corta más repetible del tema.</div>`},
 {h:"Recomendaciones NIST SP 800-63B-4 (agosto 2025)", html:`<div class="tw"><table><thead><tr><th>Antes (“lo de toda la vida”)</th><th>Ahora</th></tr></thead><tbody>
 <tr><td>Mínimo 8 caracteres</td><td><b>15 mínimo</b> si la contraseña es el <b>único factor</b> · <span class='n'>8</span> si hay <span class='si'>MFA</span></td></tr>
 <tr><td>Longitud máxima corta</td><td>Permitir al menos <span class='n'>64 caracteres</span>, incluidos <b>espacios</b></td></tr>
 <tr><td>Obligar a mayúsculas, números y símbolos</td><td><span class='no'>No imponer reglas de composición</span></td></tr>
 <tr><td>Cambio obligatorio cada 30, 60 o 90 días</td><td><span class='no'>No obligar a cambios periódicos</span>: solo si hay <b>indicios de compromiso</b></td></tr>
 <tr><td>Pistas y preguntas de seguridad</td><td><span class='no'>Prohibidas</span></td></tr>
 <tr><td>Prohibido pegar</td><td><span class='si'>Permitir</span> gestores de contraseñas y pegar</td></tr>
 <tr><td>—</td><td>Comprobar contra una <b>lista negra</b>: filtradas, comunes, nombre del servicio</td></tr>
 <tr><td>—</td><td><b>Limitar los intentos fallidos</b> · guardar con <span class='si'>hash lento + sal</span></td></tr>
 </tbody></table></div>
 <p><b>Por qué:</b> las reglas de composición y los cambios frecuentes llevan a <b>patrones previsibles</b> (<code>Verano2026! → Otoño2026!</code>) y a apuntar las contraseñas en pósits.</p>`},
 {h:"Más allá de la contraseña", html:`<ul>
 <li><span class='si'>MFA</span> = combinar factores <b>de tipos distintos</b>: algo que <b>sabes</b> (contraseña, PIN), algo que <b>tienes</b> (móvil, llave USB FIDO2, tarjeta), algo que <b>eres</b> (huella, cara).</li>
 <li>Del más débil al más fuerte: <b>SMS &lt; app con código (TOTP) &lt; notificación con número &lt; llave FIDO2 o passkey</b>.</li>
 <li><b>Gestores</b> (Bitwarden, KeePassXC): una contraseña <b>única y larga por servicio</b>; solo hay que recordar la <b>maestra</b>, que debe ser una <b>frase larga + MFA</b>. Hay versiones corporativas para compartir credenciales de forma controlada.</li>
 <li><b>Passkeys:</b> sustituyen la contraseña por un <b>par de claves criptográficas</b> guardadas en el dispositivo. <span class='si'>Resistentes al phishing</span>.</li></ul>`},
 {h:"Qué incluye una política de contraseñas (los 10 puntos)", html:`<ol class="steps">
 <li><b>Objetivo, alcance y responsables.</b></li>
 <li><b>Requisitos de creación:</b> longitud mínima, lista negra, sin datos personales, sin reutilizar.</li>
 <li><b>Requisitos por tipo de cuenta:</b> usuario, <b>administrador</b>, <b>servicio</b>, <b>dispositivo</b>, externo.</li>
 <li><b>MFA:</b> dónde es obligatorio (acceso remoto, correo, cuentas privilegiadas).</li>
 <li><b>Uso y custodia:</b> personal e intransferible, gestor autorizado, nada de pósits ni mensajería.</li>
 <li><b>Limitación de intentos y bloqueo.</b></li>
 <li><b>Cambio:</b> al instalar (contraseñas de fábrica) y ante sospecha de compromiso.</li>
 <li><b>Recuperación y restablecimiento</b> seguros, con verificación de identidad.</li>
 <li><b>Almacenamiento técnico:</b> hash lento + sal, cifrado en tránsito.</li>
 <li><b>Formación, incumplimiento</b> y <b>revisión</b> de la política.</li></ol>`}
]},
{id:"t6", short:"SAI", n:6, title:"Sistemas de alimentación ininterrumpida (SAI)", ra:"RA1 · CE e, CE f · energía estable para equipos críticos", blocks:[
 {h:"Perturbaciones de la red eléctrica", html:`<div class="tw"><table><thead><tr><th>Perturbación</th><th>Qué es</th><th>Efecto en los equipos</th></tr></thead><tbody>
 <tr><td><span class="k">Corte</span></td><td>Falta <b>total</b> de tensión durante segundos u horas</td><td>Apagado brusco, pérdida de datos</td></tr>
 <tr><td><span class="k">Microcorte</span></td><td>Interrupción de <b>milisegundos</b></td><td>Reinicios inesperados</td></tr>
 <tr><td><span class="k">Subtensión</span></td><td>Tensión <b>por debajo</b> de lo normal (p. ej. 190 V)</td><td>Fallos y bloqueos, desgaste de las fuentes</td></tr>
 <tr><td><span class="k">Sobretensión sostenida</span></td><td>Tensión <b>por encima</b> de lo normal durante tiempo</td><td>Sobrecalentamiento, averías</td></tr>
 <tr><td><span class="k">Pico o transitorio</span></td><td>Subida <b>muy breve y muy alta</b> (rayos, maniobras en la red)</td><td>Fuentes y placas dañadas</td></tr>
 <tr><td><span class="k">Ruido eléctrico</span></td><td>Interferencias de <b>motores y maquinaria</b></td><td>Errores y comportamiento inestable</td></tr>
 <tr><td><span class="k">Variación de frecuencia</span></td><td>La red o un <b>generador</b> no mantiene 50 Hz</td><td>Problemas en equipos sensibles</td></tr>
 </tbody></table></div>
 <p>En España la red doméstica es de <span class='n'>230 V y 50 Hz</span>.</p>`},
 {h:"Qué es un SAI y sus componentes", html:`<p>Equipo con <b>baterías</b> y <b>electrónica de potencia</b> entre la red y los equipos. Sus <b>3 funciones</b>:</p>
 <ol class="steps"><li><b>Mantener la alimentación</b> durante un corte, un tiempo limitado (<b>autonomía</b>).</li>
 <li><b>Filtrar y estabilizar</b> la tensión: picos, subidas, bajadas y ruido.</li>
 <li><b>Avisar</b> y permitir un <b>apagado ordenado</b> de los equipos.</li></ol>
 <div class="tw"><table><thead><tr><th>Componente</th><th>Función</th></tr></thead><tbody>
 <tr><td><span class="k">Rectificador o cargador</span></td><td>Carga las baterías</td></tr>
 <tr><td><span class="k">Baterías</span></td><td>Plomo-ácido selladas (<b>VRLA</b>) o de <b>litio</b></td></tr>
 <tr><td><span class="k">Inversor</span></td><td>Convierte la <b>corriente continua</b> de la batería en <b>alterna</b> (230 V)</td></tr>
 <tr><td><span class="k">Bypass</span></td><td>Alimenta <b>directamente desde la red</b> si el SAI falla o está en mantenimiento</td></tr>
 <tr><td><span class="k">Comunicación</span></td><td>USB, serie o <b>tarjeta de red (SNMP)</b></td></tr>
 </tbody></table></div>
 <div class="note trap"><span class="lbl">Frase clave</span>Un SAI <span class='no'>no es un generador</span>: su objetivo es <b>ganar minutos, no horas</b>.</div>`},
 {h:"Tipos de SAI (norma IEC 62040-3)", html:`<div class="tw"><table><thead><tr><th></th><th>Off-line (standby) · <b>VFD</b></th><th>Interactivo (line-interactive) · <b>VI</b></th><th>On-line doble conversión · <b>VFI</b></th></tr></thead><tbody>
 <tr><td>Funcionamiento</td><td>Los equipos van a la red; si falla, <b>conmuta a batería</b></td><td>Como el off-line, pero <b>regula la tensión (AVR)</b> sin gastar batería</td><td>Los equipos van <b>siempre por el inversor</b></td></tr>
 <tr><td>Tiempo de conmutación</td><td>≈ <span class='n'>2-10 ms</span></td><td>≈ <span class='n'>2-4 ms</span></td><td><span class='si'>Cero</span></td></tr>
 <tr><td>Protege frente a</td><td>Cortes y picos</td><td>+ <b>subidas y bajadas</b> de tensión</td><td><b>Todo</b>, incluida la <b>frecuencia</b></td></tr>
 <tr><td>Forma de onda en batería</td><td>Escalonada o pseudosenoidal</td><td>Pseudosenoidal o senoidal pura</td><td><span class='si'>Senoidal pura</span></td></tr>
 <tr><td>Precio</td><td>Bajo</td><td>Medio</td><td>Alto</td></tr>
 <tr><td>Uso típico</td><td>PC de oficina, router doméstico</td><td>Pequeñas oficinas, servidores</td><td><b>CPD, equipos críticos 24/7</b></td></tr>
 </tbody></table></div>
 <div class="note tip"><span class="lbl">Dato que decide varios casos prácticos</span>Las fuentes con <b>PFC activo</b>, habituales en <b>servidores</b>, pueden funcionar mal con <b>onda escalonada</b>: para ellas hace falta <span class='si'>onda senoidal pura</span> → interactivo con senoidal pura u <b>on-line</b>. Y si hay <b>generador diésel</b> o problemas de <b>frecuencia</b>, la respuesta es <b>on-line (VFI)</b>, el único que corrige la frecuencia.</div>`},
 {h:"Potencia: VA y W", html:`<div class="note form"><span class="lbl">Factor de potencia</span><span class="eq">W = VA × FP</span>
 <b>VA (voltamperios):</b> potencia <b>aparente</b> = tensión × intensidad. <b>W (vatios):</b> potencia <b>real</b> que consumen los equipos. En los SAI actuales el <b>FP suele estar entre 0,6 y 1</b>.<br>
 Un SAI de <span class='n'>1500 VA / 900 W</span> tiene FP = 0,6 → <b>hay que cumplir los dos límites</b>: no superar 1500 VA ni 900 W.</div>
 <p><b>De dónde sale el consumo de cada equipo</b>, de más a menos fiable:</p>
 <ol class="steps"><li><span class='si'>Medido</span> con un medidor de consumo o con el propio SAI: <span class='si'>lo más fiable</span>.</li>
 <li><b>Ficha técnica</b> del fabricante: consumo típico o máximo.</li>
 <li><b>Etiqueta de la fuente</b>: es el máximo posible, así que <b>sobredimensiona</b>.</li></ol>`},
 {h:"Dimensionado paso a paso", html:`<ol class="steps"><li><b>Inventario</b> de los equipos que irán conectados al SAI y su consumo en W.</li>
 <li><b>Suma</b> de consumos = <b>carga total</b>.</li>
 <li><b>Margen</b>: que el SAI trabaje como máximo al <span class='n'>70-80 %</span> de su capacidad (prevé crecimiento y alarga la vida).</li>
 <li><b>Autonomía necesaria</b>: tiempo para el <b>apagado ordenado</b> de todo (o para que arranque el generador), más un margen.</li>
 <li><b>Comprobar en las tablas del fabricante</b> la autonomía real con esa carga.</li>
 <li><b>Elegir</b> el tipo, la forma de onda, el número y tipo de tomas, la comunicación (USB o red) y el formato (torre o rack).</li></ol>
 <div class="note form"><span class="lbl">Las dos fórmulas del examen</span><span class="eq">Potencia mínima del SAI (W) = carga total ÷ 0,75</span><span class="eq">t (h) ≈ (V_bat × Ah × η) ÷ P(W)</span>
 <b>V_bat × Ah</b> = energía de las baterías en <b>Wh</b> · <b>η</b> = rendimiento del inversor (<span class='n'>≈ 0,85-0,9</span>) · <b>P</b> = carga conectada.<br>
 <b>Ejemplo del temario:</b> 2 baterías de 12 V y 9 Ah → <span class='n'>24 V × 9 Ah = 216 Wh</span>. Con η = 0,85 y 450 W → 216 × 0,85 ÷ 450 = <span class='n'>0,41 h ≈ 24 min</span>.</div>
 <div class="note trap"><span class="lbl">Siempre añade esta coletilla</span>La cifra de la fórmula es <b>optimista</b>: cuanto más rápido se descarga una batería, <b>menos energía entrega</b> (<b>efecto Peukert</b>); además la capacidad <b>baja con la edad y el calor</b>. <b>Para decidir se usan siempre las tablas de autonomía del fabricante.</b></div>`},
 {h:"Puntos de aplicación: qué enchufar y qué no", html:`<div class="tw"><table><thead><tr><th>Tomas CON batería</th><th>NO conectar a batería</th></tr></thead><tbody>
 <tr><td>Servidores, NAS y cabinas de almacenamiento</td><td><b>Impresoras láser</b>: el <b>fusor</b> tiene picos de consumo muy altos</td></tr>
 <tr><td>Electrónica de red troncal: router, cortafuegos, switches principales, ONT</td><td>Calefactores, aire acondicionado, frigoríficos, cafeteras y <b>motores</b></td></tr>
 <tr><td>Equipos de negocio críticos: <b>TPV</b>, centralita, grabador de cámaras, control de accesos</td><td><b>Regletas encadenadas</b> detrás del SAI</td></tr>
 <tr><td>El monitor del servidor <b>solo si hace falta</b> para el apagado</td><td>Muchos SAI tienen tomas <b>“solo protección contra picos”</b>, sin batería, para equipos no críticos</td></tr>
 </tbody></table></div>`},
 {h:"Topologías y ubicación del SAI", html:`<ul>
 <li><b>SAI por equipo (distribuido):</b> barato y sencillo, pero <b>difícil de gestionar</b> si son muchos.</li>
 <li><b>SAI centralizado</b> por rack o sala: una sola gestión.</li>
 <li><b>SAI general + grupo electrógeno:</b> para servicios <span class='n'>24/7</span>.</li>
 <li><b>Redundancia:</b> servidores con <b>doble fuente</b> conectada a <b>dos SAI distintos</b> (<b>N+1</b>).</li></ul>
 <h4 class="sub">Dónde colocarlo</h4>
 <ul><li>Sala <b>ventilada</b>, a <span class='n'>20-25 °C</span>: el calor <b>acorta mucho la vida de las baterías</b>.</li>
 <li><b>Lejos del agua</b> y de la humedad.</li>
 <li>En el <b>suelo o en la parte baja del rack</b>, porque <b>pesa mucho</b>.</li>
 <li>Con <b>acceso para el mantenimiento</b> y el cambio de baterías.</li></ul>`},
 {h:"Apagado ordenado", html:`<p>El SAI se comunica con los equipos (USB o red) mediante <b>software de gestión</b>: <b>NUT (Network UPS Tools), apcupsd, PowerChute</b>.</p>
 <ol class="steps"><li>Se va la corriente → el SAI pasa a <b>batería</b> y <b>avisa</b> (alarma sonora, correo, registro).</li>
 <li>Si vuelve la corriente en poco tiempo → <span class='no'>no se hace nada</span>.</li>
 <li>Si no vuelve en <b>X minutos</b> o la batería baja del <b>N %</b> → empieza el apagado:<br><b>máquinas virtuales → servidores de aplicaciones → bases de datos → NAS</b>.</li>
 <li>Finalmente <b>el SAI se apaga</b> para no descargar del todo las baterías.</li>
 <li>Cuando vuelve la corriente → <b>recarga</b> y <b>arranque automático</b> en el orden correcto.</li></ol>`},
 {h:"Verificación del funcionamiento", html:`<div class="tw"><table><thead><tr><th>Prueba</th><th>Qué comprueba</th><th>Frecuencia</th></tr></thead><tbody>
 <tr><td>Revisión visual y del panel</td><td>Alarmas, carga, estado de la batería, temperatura</td><td>Semanal o mensual</td></tr>
 <tr><td><b>Autotest</b> (self-test)</td><td>Que la batería y el inversor responden</td><td>Mensual (automático)</td></tr>
 <tr><td>Revisión del registro de eventos</td><td>Cortes, transferencias, errores</td><td>Mensual</td></tr>
 <tr><td><b>Prueba de corte simulado</b></td><td>Que los equipos aguantan y salta el aviso</td><td><b>Semestral</b></td></tr>
 <tr><td>Calibración de autonomía</td><td>Autonomía real con la carga actual</td><td>Anual</td></tr>
 <tr><td>Prueba del apagado ordenado</td><td>Que el software apaga todo en orden</td><td>Anual o tras cambios</td></tr>
 <tr><td>Sustitución de baterías</td><td>Las <b>VRLA duran 3-5 años</b></td><td>Según fecha y estado</td></tr>
 </tbody></table></div>
 <p>Todo se anota en un <b>registro de mantenimiento</b>.</p>
 <div class="note form"><span class="lbl">Leer la salida de upsc (NUT)</span><pre style="margin:8px 0">battery.charge: 38        ← % de batería
battery.charge.low: 20    ← umbral para iniciar el apagado
battery.date: 2021/03/15  ← batería de más de 3-5 años
battery.runtime: 420      ← SEGUNDOS de autonomía (420 s = 7 min)
input.voltage: 0.0        ← NO hay corriente en la red
output.voltage: 230.0     ← sigue dando 230 V desde batería
ups.load: 64              ← % de carga
ups.status: OB DISCHRG    ← On Battery + descargando
ups.temperature: 34       ← alta (lo bueno es 20-25 °C)
ups.test.result: Done and warning  ← el autotest avisa</pre>
 <b>battery.runtime viene en segundos</b>: divide entre 60 para dar minutos. Al llegar a <code>charge.low</code> (20 %) el software lanza el <b>apagado ordenado</b> y luego el SAI se apaga.</div>`}
]},

{id:"t7", short:"Biometría", n:7, title:"Sistemas biométricos", ra:"RA1 · CE i · tu cuerpo como credencial", blocks:[
 {h:"Los tres factores de autenticación", html:`<div class="tw"><table><thead><tr><th>Factor</th><th>Ejemplos</th><th>Puede…</th></tr></thead><tbody>
 <tr><td>Algo que <b>sabes</b></td><td>Contraseña, PIN</td><td>olvidarse, adivinarse, contarse</td></tr>
 <tr><td>Algo que <b>tienes</b></td><td>Tarjeta, llave, móvil, llave FIDO2</td><td>perderse, prestarse, robarse</td></tr>
 <tr><td>Algo que <b>eres</b></td><td>Huella, cara, iris, voz…</td><td><b>no se olvida ni se presta, pero tampoco se puede cambiar</b></td></tr>
 </tbody></table></div>
 <p>La <b>biometría</b> es el <b>tercer factor</b>: identifica o verifica a una persona por sus <b>características físicas o de comportamiento</b>. Lo más seguro es <b>combinar factores (MFA)</b>: por ejemplo <b>tarjeta + huella</b> para entrar al CPD.</p>`},
 {h:"Qué hace “buena” a una característica biométrica (las 7)", html:`<div class="tw"><table><thead><tr><th>Propiedad</th><th>Pregunta</th></tr></thead><tbody>
 <tr><td><span class="k">Universalidad</span></td><td>¿La tienen <b>todas</b> las personas?</td></tr>
 <tr><td><span class="k">Unicidad</span></td><td>¿Es <b>distinta</b> en cada persona?</td></tr>
 <tr><td><span class="k">Permanencia</span></td><td>¿Se <b>mantiene con el tiempo</b>?</td></tr>
 <tr><td><span class="k">Mensurabilidad</span></td><td>¿Se puede <b>capturar y medir</b> fácilmente?</td></tr>
 <tr><td><span class="k">Rendimiento</span></td><td>¿Es <b>rápida y precisa</b>?</td></tr>
 <tr><td><span class="k">Aceptabilidad</span></td><td>¿La <b>gente acepta</b> usarla?</td></tr>
 <tr><td><span class="k">Resistencia al fraude</span></td><td>¿Es <b>difícil de falsificar</b> o imitar?</td></tr>
 </tbody></table></div>
 <p>Ninguna técnica destaca en todo: <b>elegir es buscar el equilibrio</b> para cada uso.</p>`},
 {h:"Tipos de biometría", html:`<div class="tw"><table><thead><tr><th>Fisiológica o estática — lo que <b>eres</b></th><th>De comportamiento o dinámica — cómo <b>actúas</b></th></tr></thead><tbody>
 <tr><td>Huella dactilar</td><td><b>Voz</b> (tiene parte física y parte de comportamiento)</td></tr>
 <tr><td>Reconocimiento facial (2D y 3D)</td><td>Firma dinámica: presión, velocidad, trazo</td></tr>
 <tr><td>Iris · Retina</td><td>Forma de teclear: ritmo entre teclas</td></tr>
 <tr><td>Geometría de la mano</td><td>Forma de andar (marcha)</td></tr>
 <tr><td>Patrón de venas del dedo o la palma</td><td><i>Más variables con el tiempo, el cansancio o el estado de ánimo</i></td></tr>
 </tbody></table></div>`},
 {h:"Cómo funciona un sistema biométrico", html:`<p><b>Registro (enrolamiento), una sola vez:</b> captura (sensor) → extracción de características → <b>plantilla (patrón)</b> → almacenamiento <b>cifrado</b>.</p>
 <p><b>Uso, cada acceso:</b> captura → extracción → comparación con la plantilla → ¿<b>puntuación ≥ umbral</b>? sí / no.</p>
 <div class="note tip"><span class="lbl">Las dos ideas que más caen</span><span class='no'>No se guarda la foto ni la huella</span>, sino una <b>plantilla</b>: un conjunto de <b>datos numéricos</b> (puntos característicos de la huella, distancias de la cara). Y la comparación <span class='no'>nunca es exacta</span>: da una <b>puntuación de parecido</b> y el sistema decide según un <b>umbral</b>.</div>`},
 {h:"Verificación (1:1) frente a identificación (1:N)", html:`<div class="tw"><table><thead><tr><th></th><th>Verificación 1:1</th><th>Identificación 1:N</th></tr></thead><tbody>
 <tr><td>Pregunta</td><td><b>“¿Eres quien dices ser?”</b></td><td><b>“¿Quién eres?”</b></td></tr>
 <tr><td>Previo</td><td>La persona <b>se identifica antes</b> (tarjeta, usuario)</td><td><b>No hace falta</b> tarjeta ni usuario</td></tr>
 <tr><td>Comparación</td><td>Solo con <b>su</b> plantilla</td><td>Con <b>todas</b> las plantillas de la base de datos</td></tr>
 <tr><td>Pros / contras</td><td><span class='si'>Más rápida y precisa</span>; la plantilla puede ir <b>en la tarjeta o el dispositivo</b> (<i>match-on-card</i>)</td><td><b>Más cómoda</b>, pero <span class='no'>más errores</span> y más riesgo: exige <b>base de datos centralizada</b></td></tr>
 </tbody></table></div>
 <p>Desde el punto de vista de la <b>privacidad</b>, la <b>verificación 1:1 con la plantilla en poder del usuario</b> es la opción <span class='si'>menos invasiva</span>.</p>`},
 {h:"Los errores: FAR, FRR, EER y FTE", html:`<div class="tw"><table><thead><tr><th>Tasa</th><th>Significado</th><th>Consecuencia</th></tr></thead><tbody>
 <tr><td><span class="k">FAR</span><br><i>False Acceptance Rate</i></td><td>Falsa aceptación: <span class='no'>entra quien no debería</span></td><td>Problema de <b>SEGURIDAD</b></td></tr>
 <tr><td><span class="k">FRR</span><br><i>False Rejection Rate</i></td><td>Falso rechazo: <span class='no'>no entra quien sí debería</span></td><td>Problema de <b>COMODIDAD</b></td></tr>
 <tr><td><span class="k">EER</span><br><i>Equal Error Rate</i></td><td>Punto en que <b>FAR = FRR</b></td><td>Sirve para <b>comparar sistemas</b>: cuanto <b>más bajo, mejor</b></td></tr>
 <tr><td><span class="k">FTE</span><br><i>Failure To Enrol</i></td><td>Personas que <span class='no'>no se pueden registrar</span></td><td>Hace falta un <span class='si'>método alternativo</span></td></tr>
 </tbody></table></div>
 <div class="note form"><span class="lbl">Las dos fórmulas</span><span class="eq">FAR = falsas aceptaciones ÷ intentos de impostores</span><span class="eq">FRR = falsos rechazos ÷ intentos legítimos</span>
 Se expresan en <b>%</b>: multiplica por 100. Ejemplo del temario: 5 de 1.000 impostores entran → FAR = 5/1000 = <span class='n'>0,5 %</span>. 60 de 2.000 legítimos rechazados → FRR = 60/2000 = <span class='n'>3 %</span>.</div>`},
 {h:"El umbral: seguridad frente a comodidad", html:`<ul>
 <li><b>Umbral bajo</b> (poco exigente): entra casi todo el mundo → <b>más FAR, menos FRR</b>. Más cómodo, menos seguro.</li>
 <li><b>Umbral alto</b> (muy exigente): <b>menos FAR, más FRR</b>. Más seguro, menos cómodo.</li>
 <li>Se ajusta <b>según el uso</b>: no es lo mismo un <b>CPD</b> que el <b>comedor</b> de la empresa.</li></ul>
 <div class="note tip"><span class="lbl">Cómo razonarlo en el examen</span>Pregúntate qué error <b>duele más</b>. Si lo grave es que entre un impostor (CPD de un banco, zona crítica) → <b>umbral alto</b>, aceptas más falsos rechazos. Si lo grave es la cola y el cabreo (comedor, fichaje, gimnasio) → <b>umbral bajo o medio</b>. En un <b>móvil personal</b>, umbral <b>medio</b>: hay que equilibrar, y además tiene PIN de respaldo.</div>`},
 {h:"Comparativa de técnicas", html:`<div class="tw"><table><thead><tr><th>Técnica</th><th>Precisión</th><th>Coste</th><th>Aceptación</th><th>Contacto</th><th>Uso típico</th></tr></thead><tbody>
 <tr><td><b>Huella dactilar</b></td><td>Alta</td><td>Bajo</td><td>Alta</td><td>Sí</td><td>Móviles, fichaje, puertas</td></tr>
 <tr><td><b>Facial</b></td><td>Media-alta (3D: alta)</td><td>Bajo-medio</td><td>Alta</td><td>No</td><td>Móviles, puertas, fronteras</td></tr>
 <tr><td><b>Iris</b></td><td>Muy alta</td><td>Alto</td><td>Media</td><td>No</td><td>Zonas de alta seguridad</td></tr>
 <tr><td><b>Retina</b></td><td>Muy alta</td><td>Muy alto</td><td><span class='no'>Baja</span></td><td>Muy cercano</td><td>Instalaciones críticas</td></tr>
 <tr><td><b>Geometría de la mano</b></td><td>Media</td><td>Medio</td><td>Alta</td><td>Sí</td><td>Control de acceso o de presencia</td></tr>
 <tr><td><b>Venas del dedo o la palma</b></td><td>Muy alta</td><td>Medio-alto</td><td>Alta</td><td>Sin contacto (o casi)</td><td>Banca, hospitales, CPD</td></tr>
 <tr><td><b>Voz</b></td><td>Media</td><td>Bajo</td><td>Alta</td><td>No</td><td>Atención telefónica</td></tr>
 <tr><td><b>Firma dinámica</b></td><td>Media</td><td>Bajo</td><td>Alta</td><td>Sí (tableta)</td><td>Firma de documentos</td></tr>
 </tbody></table></div>
 <p>Tecnologías del sensor de huella: <b>capacitancia</b> (velocidad muy alta, coste bajo), <b>resistividad</b>, <b>ultrasonido</b> (resolución alta, coste alto, alta seguridad), <b>térmica</b> (resolución baja, coste muy bajo), <b>acústica</b>, <b>electromagnética</b> (alta resolución y coste) y <b>óptica</b>.</p>`},
 {h:"Ventajas", html:`<ul>
 <li><b>No se olvida, no se pierde y no se presta</b>: se acabaron las tarjetas prestadas y las contraseñas compartidas.</li>
 <li><b>Vinculada a la persona</b> → mejor <span class='si'>trazabilidad</span> de quién accede.</li>
 <li><b>Comodidad y rapidez</b>: no hay que recordar nada.</li>
 <li><span class='no'>Difícil de transferir</span>: evita que un compañero <b>fiche por otro</b>.</li>
 <li><b>Refuerza la MFA</b>: como segundo factor sube mucho la seguridad.</li>
 <li><b>Menos gestión</b>: no hay que reponer tarjetas ni restablecer contraseñas.</li></ul>`},
 {h:"Inconvenientes y riesgos (riesgo → medida)", html:`<div class="tw"><table><thead><tr><th>Riesgo</th><th>Explicación</th><th>Medida</th></tr></thead><tbody>
 <tr><td><b>No se puede cambiar</b></td><td>Si se compromete una plantilla, no puedes “cambiar de huella”</td><td>Plantillas <b>cifradas y revocables</b>, no guardar imágenes</td></tr>
 <tr><td><b>Suplantación</b></td><td>Réplicas de huella, fotos o máscaras</td><td><span class='si'>Detección de vida (liveness)</span></td></tr>
 <tr><td><b>Falsos rechazos</b></td><td>Heridas, edad, suciedad, gafas, mascarilla</td><td>Umbral adecuado, segundo intento, alternativa</td></tr>
 <tr><td><b>Exclusión</b></td><td>Personas que no se pueden registrar (<b>FTE</b>)</td><td><b>Método alternativo no biométrico</b></td></tr>
 <tr><td><b>Privacidad</b></td><td>Dato muy sensible que revela información de la persona</td><td>Minimización, <span class='si'>verificación 1:1</span>, plantilla en el dispositivo</td></tr>
 <tr><td><b>Coste</b></td><td>Lectores, software, integración y mantenimiento</td><td>Usarla <b>solo donde está justificada</b></td></tr>
 </tbody></table></div>`},
 {h:"Marco legal: son datos especiales", html:`<ul>
 <li><b>RGPD, art. 9:</b> los datos biométricos que identifican de forma única a una persona son <b>categoría especial</b>. Su tratamiento está <span class='no'>prohibido salvo excepciones</span>.</li>
 <li>Antes de implantarlos hace falta, en general, una <b>evaluación de impacto (EIPD)</b> que demuestre que son <b>necesarios y proporcionados</b>.</li>
 <li><b>AEPD, guía sobre control de presencia biométrico (noviembre de 2023):</b>
 <ul><li>el <b>consentimiento del trabajador no suele ser válido</b>, por el <b>desequilibrio</b> con la empresa;</li>
 <li>si existe una alternativa <span class='si'>menos invasiva</span> (tarjeta, código), la biometría <span class='no'>deja de ser necesaria</span>;</li>
 <li>para <b>fichar</b> (registro de jornada), <span class='no'>en general no está justificada</span>.</li></ul></li>
 <li><b>Reglamento europeo de IA:</b> prohíbe, entre otros usos, el <b>reconocimiento de emociones en el trabajo y en los centros educativos</b>.</li></ul>
 <div class="note trap"><span class="lbl">Respuesta modelo</span>“¿Puede el gimnasio o la empresa obligarme a entrar con la huella?” → <b>En general no</b>: es un dato de <b>categoría especial</b> (RGPD art. 9), el <b>consentimiento del trabajador no es válido</b> por el desequilibrio y, si hay una <b>alternativa menos invasiva</b> como la tarjeta, la biometría <span class='no'>no es necesaria ni proporcionada</span>. Para <b>fichar</b> la AEPD dice que no está justificada.</div>`},
 {h:"Buenas prácticas al implantar biometría (las 8)", html:`<ol class="steps">
 <li><b>Justificar la necesidad</b>: ¿hay una alternativa menos invasiva? → <b>EIPD</b>.</li>
 <li>Preferir la <span class='si'>verificación 1:1</span> a la identificación 1:N.</li>
 <li>Guardar <b>plantillas cifradas, nunca imágenes</b>; mejor en la <b>tarjeta o el dispositivo</b> que en un servidor central.</li>
 <li>Exigir <span class='si'>detección de vida</span> en los lectores.</li>
 <li><b>Combinar con otro factor</b> en zonas críticas: tarjeta + biometría.</li>
 <li>Ofrecer <b>siempre un método alternativo</b>.</li>
 <li><b>Informar</b> a las personas y <b>borrar</b> las plantillas cuando ya no hagan falta (bajas).</li>
 <li>Ajustar el <b>umbral</b> según el nivel de riesgo de cada zona.</li></ol>`}
]}
];
