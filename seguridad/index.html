["¿Cuál de estas es una biometría de comportamiento?",["Iris","Venas de la palma","Forma de teclear","Geometría de la mano"],2,"Comportamiento o dinámica: voz, firma dinámica, forma de teclear y forma de andar."],
["Un sistema biométrico guarda…",["la foto o la imagen de la huella","una plantilla con datos numéricos","la contraseña cifrada del usuario","un hash del DNI"],1,"No se guarda la imagen, sino una plantilla: datos numéricos de los puntos característicos."],
["Desbloquear el móvil con la huella es un caso de…",["verificación 1:1","identificación 1:N","enrolamiento","autorización"],0,"Se compara solo con la plantilla del dueño del dispositivo: 1:1."],
["Una puerta que se abre sola al reconocer la cara de cualquier empleado registrado es…",["verificación 1:1","identificación 1:N","detección de vida","match-on-card"],1,"No hay identificación previa: se compara con todas las plantillas (1:N)."],
["Que entre quien no debería es un problema de…",["FRR, de comodidad","FAR, de seguridad","FTE, de exclusión","EER, de comparación"],1,"FAR (False Acceptance Rate) es un problema de seguridad."],
["Si subimos el umbral de un sistema biométrico…",["baja el FAR y sube el FRR","sube el FAR y baja el FRR","bajan los dos","no cambia nada"],0,"Más exigente: entran menos impostores pero se rechaza más a los legítimos."],
["El EER sirve para…",["medir cuántas personas no se pueden registrar","comparar sistemas: es el punto donde FAR = FRR","calcular la autonomía del lector","fijar el umbral legalmente obligatorio"],1,"Equal Error Rate: cuanto más bajo, mejor el sistema."],
["Que haya personas a las que el sistema no puede registrar se mide con…",["FAR","FRR","EER","FTE"],3,"FTE, Failure To Enrol. Obliga a ofrecer un método alternativo."],
["La medida contra la suplantación con fotos, máscaras o réplicas de huella es…",["subir el umbral al máximo","la detección de vida (liveness)","usar identificación 1:N","cifrar la plantilla"],1,"La detección de vida comprueba que la muestra viene de una persona viva."],
["Según el RGPD, los datos biométricos que identifican de forma única a una persona son…",["datos ordinarios","datos de categoría especial (art. 9)","datos anónimos","datos públicos"],1,"Categoría especial: su tratamiento está prohibido salvo excepciones."],
["Según la guía de la AEPD de noviembre de 2023, usar biometría para fichar…",["es obligatorio desde 2024","en general no está justificada","solo vale con consentimiento del trabajador","es la opción recomendada"],1,"Además, el consentimiento del trabajador no suele ser válido por el desequilibrio con la empresa."],
["Desde el punto de vista de la privacidad, la opción menos invasiva es…",["identificación 1:N con base de datos central","verificación 1:1 con la plantilla en poder del usuario","guardar las imágenes cifradas en el servidor","reconocimiento facial en la entrada"],1,"Verificación 1:1 y plantilla en la tarjeta o el dispositivo (match-on-card)."],
["Para la sala de servidores de un banco, la configuración más adecuada es…",["solo huella con umbral bajo","tarjeta + biometría con umbral alto","solo tarjeta","reconocimiento facial 2D con umbral bajo"],1,"Zona crítica: MFA (tarjeta + biometría) y umbral alto, asumiendo más falsos rechazos."],
["El Reglamento europeo de IA prohíbe, entre otros usos…",["el uso de huella para desbloquear móviles","el reconocimiento de emociones en el trabajo y en los centros educativos","cualquier uso del reconocimiento facial","las plantillas cifradas"],1,"Prohíbe el reconocimiento de emociones en el ámbito laboral y educativo."]
];
/* c = cortas [enunciado, solución] */
const CORTAS = [
["Define amenaza, vulnerabilidad y riesgo, y pon un ejemplo que relacione los tres.","<b>Amenaza:</b> algo o alguien capaz de causar daño; el agente con capacidad e intención de causarlo. <b>Vulnerabilidad:</b> debilidad de un sistema. <b>Riesgo:</b> probabilidad de que una amenaza aproveche una vulnerabilidad.<br><b>Ejemplo:</b> un atacante externo (amenaza) explota un fallo 0-day sin parche (vulnerabilidad); el riesgo es la posibilidad de que consiga acceso no autorizado, robo o modificación de datos o instalación de malware."],
["Explica los 5 objetivos del modelo CIDAN con un ejemplo de medida para cada uno.","<b>Confidencialidad:</b> solo los autorizados acceden → cifrado, contraseñas, control de acceso. <b>Integridad:</b> los datos no se modifican sin autorización → funciones hash, copias de seguridad. <b>Disponibilidad:</b> accesibles cuando se necesitan → SAI, RAID, redundancia. <b>Autenticidad:</b> comprobar la identidad → firma electrónica, biometría, certificados. <b>No repudio:</b> nadie puede negar una acción → firma electrónica, acuses de recibo."],
["¿Qué diferencia hay entre seguridad activa y pasiva? Pon dos ejemplos de cada una.","La <b>activa</b> actúa en la interacción usuario-sistema y es <b>proactiva</b>: previene y detecta <b>antes</b> de que ocurra el ataque (antivirus, cortafuegos, contraseñas, ACL). La <b>pasiva</b> protege por el hecho de existir y <b>soluciona o minimiza</b> los efectos de un ataque <b>ya producido</b> (copias de seguridad, RAID, SAI)."],
["Enumera y explica brevemente las 5 etapas de un plan de contingencia.","<b>1. Evaluación:</b> identificar los activos críticos y analizar el impacto de su pérdida o deterioro. <b>2. Planificación:</b> documentar y validar el plan, con los miembros que se verían afectados. <b>3. Pruebas:</b> simular un entorno de prueba para comprobar la viabilidad. <b>4. Ejecución:</b> poner el plan en marcha para asegurar la continuidad. <b>5. Recuperación:</b> restablecer el sistema para que siga funcionando como si nada hubiera pasado."],
["¿Qué es una auditoría de seguridad? Diferencia entre interna y externa e indica cuál es mejor y por qué.","Es una <b>evaluación sistemática</b> sobre las políticas, protocolos, planes de contención y dispositivos que conforman la red de la entidad. La <b>interna</b> la hace la propia empresa; la <b>externa</b> se contrata fuera. Por norma general las <b>externas son más completas</b>, por su independencia y objetividad, y además pueden emitir un <b>certificado</b> de cumplimiento."],
["Explica por qué un CPD debe estar en una sala independiente y qué condiciones ambientales necesita.","Porque los equipos <b>hacen mucho ruido y desprenden mucho calor</b>, así que se sitúa lejos de los puestos de usuario. Necesita una temperatura interior de <span class='n'>17-19 °C</span> con refrigeración muy potente, funciona <span class='n'>24 h</span>, debe estar reforzado arquitectónicamente (soporta mucho peso), preferentemente en plantas bajas y evitando sótanos, sin material inflamable alrededor, y con un <b>sistema anexo de copias de seguridad</b>."],
["¿Qué es un centro de respaldo y qué tipos existen?","Es una <b>réplica casi exacta del CPD</b>, normalmente <b>alejada del original</b>, para recuperar el sistema rápidamente ante un desastre; se usa sobre todo cuando la empresa no puede permitirse tener los servidores inactivos. Tipos: <b>réplicas exactas</b>, <b>réplicas parciales</b> y <b>acuerdo mutuo</b> entre dos empresas que se respaldan la una a la otra."],
["Explica las 3 fases del control de acceso (IAA) e indica en cuál actúan las ACL.","<b>Identificación:</b> ¿quién dices ser? (usuario). <b>Autenticación:</b> demuéstralo (contraseña, tarjeta, huella). <b>Autorización:</b> ¿qué puedes hacer? Las <b>ACL actúan en la autorización</b>."],
["¿Qué es una ACL y qué es una ACE? ¿En qué se diferencia de una lista de capacidades?","Una <b>ACL</b> es la lista asociada a un <b>objeto</b> que dice quién puede hacer qué con él (organización por columnas de la matriz). Cada línea es una <b>ACE</b> (<i>Access Control Entry</i>): <b>sujeto + permiso + permitir o denegar</b>. Una <b>lista de capacidades</b> se organiza por <b>sujeto</b> (por filas): cada usuario guarda lo que puede hacer. La ACL facilita saber y revocar quién accede a un recurso; las capacidades facilitan saber todo lo que puede hacer un usuario."],
["Enumera los principios que debe cumplir cualquier ACL.","<span class='si'>Mínimo privilegio</span> (solo los permisos imprescindibles), <b>necesidad de saber</b> (solo la información necesaria para la tarea), <b>denegar por defecto</b> (lo no permitido explícitamente está prohibido), <b>segregación de funciones</b> (quien pide no aprueba), <b>permisos a grupos, no a personas</b> y <span class='si'>trazabilidad</span> (cuentas personales e intransferibles, accesos registrados)."],
["Compara los modelos DAC, MAC, RBAC y ABAC indicando quién decide en cada uno.","<b>DAC:</b> decide el <b>propietario</b> del recurso; flexible pero depende del criterio de cada usuario (Windows, Linux, nube). <b>MAC:</b> decide el <b>sistema</b> según etiquetas de clasificación y habilitación; ni el propietario puede saltárselo, muy seguro pero rígido (defensa, SELinux). <b>RBAC:</b> decide el <b>administrador</b> asignando permisos a <b>roles</b>; el más usado en empresas (ERP, Active Directory). <b>ABAC:</b> deciden <b>reglas sobre atributos</b> del usuario, el recurso y el contexto (hora, ubicación, dispositivo); muy dinámico pero complejo de auditar."],
["¿Qué es la máscara en una ACL POSIX y a quién afecta?","Es el <b>límite máximo de permisos</b> para los usuarios y grupos añadidos a la ACL. El permiso efectivo es el <b>permiso asignado AND la máscara</b>. Afecta a los <b>usuarios nombrados, al grupo propietario y a los grupos nombrados</b>, pero <b>no</b> al <b>propietario</b> del archivo ni a <b>“otros”</b>."],
["Explica el orden de evaluación de permisos en NTFS y qué ocurre con una carpeta compartida por red.","Orden de más a menos prioridad: <b>1) denegar explícito, 2) permitir explícito, 3) denegar heredado, 4) permitir heredado</b>. En una carpeta compartida por red se <b>combinan</b> los permisos de <b>recurso compartido</b> y los <b>NTFS</b> y <b>gana el más restrictivo</b>. Si el acceso es <b>local</b> (sentado en el servidor), el permiso de recurso compartido <span class='no'>no se aplica</span>."],
["Enuncia las reglas de oro de una ACL de red y explica por qué importa el orden.","<span class='n'>1)</span> Se evalúan en orden, de arriba abajo. <span class='n'>2)</span> Se aplica la <b>primera regla que coincide</b> y se deja de mirar. <span class='n'>3)</span> Al final hay un <b>denegar todo implícito</b>. <span class='n'>4)</span> Las reglas <b>más específicas van antes</b> que las generales.<br>El orden importa porque, al aplicarse solo la primera coincidencia, una regla general que deniegue colocada antes <b>anula</b> una regla específica posterior que permitiría el tráfico: esa regla nunca se llega a evaluar."],
["Nombra cuatro errores típicos en la gestión de permisos y di qué principio incumple cada uno.","<b>Permisos a Todos/Everyone</b> “para que funcione” → mínimo privilegio y denegar por defecto. <b>Cuentas compartidas</b> (la cuenta admin común) → trazabilidad. <b>Acumulación de privilegios</b> al cambiar de puesto → mínimo privilegio. <b>Bajas que no se revocan</b> (cuentas zombi) → revocación el mismo día. También: permisos directos a cada usuario → permisos a grupos; revisar solo tras un incidente → revisión periódica."],
["¿Por qué <code>Valencia2026!</code> es una mala contraseña aunque tenga mayúscula, número y símbolo?","Porque sigue un <b>patrón totalmente previsible</b>: palabra de diccionario (topónimo) + año + símbolo final. Los ataques <b>híbridos o por reglas</b> prueban exactamente esas variaciones sobre listas de palabras, así que su entropía real es muchísimo menor de lo que sugiere su aspecto. Cumple las reglas de composición pero no aporta seguridad: lo que importa es la <span class='si'>longitud</span> y que sea <b>impredecible</b>, como una frase de contraseña larga."],
["¿Qué es la sal, para qué sirve y qué ataque evita?","Es un <b>valor aleatorio distinto para cada usuario</b> que se mezcla con la contraseña antes de calcular el hash. Así <b>dos contraseñas iguales dan hashes distintos</b>, por lo que no se ve qué usuarios comparten contraseña y, sobre todo, <b>las tablas rainbow dejan de servir</b>, ya que estarían precalculadas para contraseñas sin sal."],
["Da dos razones por las que una empresa necesita una política de contraseñas por escrito.","<span class='n'>1)</span> Las <b>credenciales robadas o débiles</b> son una de las principales vías de entrada en los incidentes; sin política cada persona hace lo que quiere y la empresa queda expuesta a robo de datos, ransomware, fraude y suplantación. <span class='n'>2)</span> Una política permite fijar <b>mínimos obligatorios</b>, <b>implantarlos técnicamente</b> y <b>formar</b> al personal, además de poder exigir su cumplimiento y responder ante la <b>AEPD</b> si hay una brecha."],
["Resume los cambios principales que introduce el NIST SP 800-63B-4 (2025) frente a “lo de toda la vida”.","<b>Longitud:</b> mínimo <span class='n'>15</span> caracteres si es el único factor y <span class='n'>8</span> con MFA; permitir al menos <span class='n'>64</span>, incluidos espacios. <b>Fuera</b> las reglas de composición obligatorias, los cambios periódicos (solo ante indicios de compromiso) y las pistas y preguntas de seguridad (prohibidas). <span class='si'>Permitir</span> gestores de contraseñas y pegar. <b>Añadir</b> comprobación contra <b>lista negra</b>, <b>limitación de intentos fallidos</b> y almacenamiento con <span class='si'>hash lento + sal</span>."],
["Explica qué es el MFA, los tres tipos de factores y ordena los métodos de más débil a más fuerte.","MFA es combinar <b>factores de tipos distintos</b>: algo que <b>sabes</b> (contraseña, PIN), algo que <b>tienes</b> (móvil, tarjeta, llave FIDO2) y algo que <b>eres</b> (huella, cara). De más débil a más fuerte: <b>SMS &lt; app con código TOTP &lt; notificación con número &lt; llave FIDO2 o passkey</b>."],
["Explica las tres funciones de un SAI y nombra sus componentes principales.","<b>Funciones:</b> 1) <b>mantener la alimentación</b> durante un corte un tiempo limitado (autonomía); 2) <b>filtrar y estabilizar</b> la tensión (picos, subidas, bajadas y ruido); 3) <b>avisar</b> y permitir un <b>apagado ordenado</b>. <b>Componentes:</b> rectificador o cargador (carga las baterías), baterías (VRLA o litio), inversor (convierte continua en alterna de 230 V), bypass (alimenta desde la red si el SAI falla o está en mantenimiento) y comunicación (USB, serie o tarjeta de red SNMP). Un SAI <span class='no'>no es un generador</span>: busca ganar minutos, no horas."],
["Compara los tres tipos de SAI indicando conmutación, protección y uso típico.","<b>Off-line (VFD):</b> los equipos van a la red y conmuta a batería al fallar; <span class='n'>2-10 ms</span>; protege de <b>cortes y picos</b>; onda escalonada o pseudosenoidal; precio bajo; PC de oficina y router doméstico. <b>Line-interactive (VI):</b> igual pero con <b>AVR</b> que regula la tensión <b>sin gastar batería</b>; <span class='n'>2-4 ms</span>; añade <b>subidas y bajadas</b>; precio medio; oficinas pequeñas y servidores. <b>On-line doble conversión (VFI):</b> los equipos van <b>siempre por el inversor</b>; conmutación <span class='si'>cero</span>; protege de <b>todo, incluida la frecuencia</b>; <span class='si'>senoidal pura</span>; precio alto; <b>CPD y equipos críticos 24/7</b>."],
["Diferencia VA y W y explica qué es el factor de potencia.","<b>VA</b> (voltamperios) es la potencia <b>aparente</b> = tensión × intensidad. <b>W</b> (vatios) es la potencia <b>real</b> que consumen los equipos. Se relacionan por el <b>factor de potencia</b>: <b>W = VA × FP</b>, que en los SAI actuales está entre <span class='n'>0,6 y 1</span>. Al dimensionar hay que <span class='si'>cumplir los dos límites</span>: ni superar los VA ni los W del SAI."],
["Describe los pasos del dimensionado de un SAI.","<span class='n'>1)</span> <b>Inventario</b> de los equipos que irán conectados y su consumo en W. <span class='n'>2)</span> <b>Suma</b> de consumos = carga total. <span class='n'>3)</span> <b>Margen</b>: que trabaje como máximo al <span class='n'>70-80 %</span> → potencia mínima = carga ÷ 0,75. <span class='n'>4)</span> <b>Autonomía necesaria</b> para el apagado ordenado (o hasta que arranque el generador) más margen. <span class='n'>5)</span> <b>Comprobar las tablas del fabricante</b> para la autonomía real con esa carga. <span class='n'>6)</span> <b>Elegir</b> tipo, forma de onda, número y tipo de tomas, comunicación (USB o red) y formato (torre o rack)."],
["¿Qué equipos deben ir en las tomas con batería del SAI y cuáles no? Justifícalo.","<b>Sí:</b> servidores, NAS y cabinas de almacenamiento; electrónica de red troncal (router, cortafuegos, switches principales, ONT); equipos de negocio críticos (TPV, centralita, grabador de cámaras, control de accesos); el monitor del servidor solo si hace falta para el apagado. <b>No:</b> <b>impresoras láser</b> (el fusor tiene picos de consumo muy altos), calefactores, aire acondicionado, frigoríficos, cafeteras y motores, y <b>regletas encadenadas</b> detrás del SAI. Para lo no crítico se usan las tomas de <b>solo protección contra picos</b>."],
["Describe la secuencia de un apagado ordenado ante un corte eléctrico.","<span class='n'>1)</span> Se va la corriente: el SAI pasa a <b>batería</b> y <b>avisa</b> (alarma sonora, correo, registro). <span class='n'>2)</span> Si la corriente vuelve pronto, <span class='no'>no se hace nada</span>. <span class='n'>3)</span> Si no vuelve en <b>X minutos</b> o la batería baja del <b>N %</b>, empieza el apagado: <b>máquinas virtuales → servidores de aplicaciones → bases de datos → NAS</b>. <span class='n'>4)</span> Finalmente <b>el SAI se apaga</b> para no descargar del todo las baterías. <span class='n'>5)</span> Al volver la corriente, <b>recarga</b> y <b>arranque automático</b> en el orden correcto. El software que lo gestiona puede ser <b>NUT, apcupsd o PowerChute</b>."],
["Enumera las pruebas de verificación de un SAI con su frecuencia orientativa.","<b>Revisión visual y del panel</b> (alarmas, carga, batería, temperatura): semanal o mensual. <b>Autotest</b>: mensual y automático. <b>Revisión del registro de eventos</b>: mensual. <b>Prueba de corte simulado</b>: <b>semestral</b>. <b>Calibración de autonomía</b>: anual. <b>Prueba del apagado ordenado</b>: anual o tras cambios. <b>Sustitución de baterías</b>: las VRLA duran <span class='n'>3-5 años</span>, según fecha y estado. Todo se anota en un <b>registro de mantenimiento</b>."],
["¿Qué propiedades debe tener una buena característica biométrica?","<b>Universalidad</b> (la tienen todas las personas), <b>unicidad</b> (es distinta en cada una), <b>permanencia</b> (se mantiene en el tiempo), <b>mensurabilidad</b> (se puede capturar y medir fácilmente), <b>rendimiento</b> (rápida y precisa), <b>aceptabilidad</b> (la gente acepta usarla) y <b>resistencia al fraude</b> (difícil de falsificar). Ninguna técnica destaca en todas: elegir es <b>buscar el equilibrio</b> para cada uso."],
["Explica cómo funciona un sistema biométrico, distinguiendo registro y uso.","<b>Registro (enrolamiento), una sola vez:</b> captura con el sensor → extracción de características → generación de la <b>plantilla</b> → almacenamiento <b>cifrado</b>. <b>Uso, en cada acceso:</b> captura → extracción → <b>comparación</b> con la plantilla y decisión según si la <b>puntuación de parecido alcanza el umbral</b>. No se guarda la foto ni la huella, sino una plantilla de <b>datos numéricos</b>, y la comparación <span class='no'>nunca es exacta</span>."],
["Diferencia verificación 1:1 e identificación 1:N e indica cuál es preferible y por qué.","<span class='si'>Verificación 1:1</span> (“¿eres quien dices ser?”): la persona se identifica antes con tarjeta o usuario y se compara solo con <b>su</b> plantilla; es <span class='si'>más rápida y precisa</span> y la plantilla puede ir en la tarjeta o el dispositivo (<i>match-on-card</i>). <b>Identificación 1:N</b> (“¿quién eres?”): no hace falta identificarse y se compara con <b>todas</b> las plantillas; es más cómoda pero da <span class='no'>más errores</span> y exige una <b>base de datos centralizada</b>. Es preferible la <b>1:1 con la plantilla en poder del usuario</b>, por ser la <span class='si'>menos invasiva</span> para la privacidad."],
["Define FAR, FRR, EER y FTE, e indica qué problema representa cada uno.","<b>FAR</b> (False Acceptance Rate): tasa de falsa aceptación, <span class='no'>entra quien no debería</span> → problema de <b>seguridad</b>; FAR = falsas aceptaciones ÷ intentos de impostores. <b>FRR</b> (False Rejection Rate): falso rechazo, <span class='no'>no entra quien sí debería</span> → problema de <b>comodidad</b>; FRR = falsos rechazos ÷ intentos legítimos. <b>EER</b> (Equal Error Rate): punto donde <b>FAR = FRR</b>, sirve para <b>comparar sistemas</b> (más bajo, mejor). <b>FTE</b> (Failure To Enrol): personas que <span class='no'>no se pueden registrar</span>, obliga a un <span class='si'>método alternativo</span>."],
["Explica la relación entre el umbral, el FAR y el FRR, y cómo se elige.","El umbral es la <b>puntuación mínima de parecido</b> para aceptar. Si se <b>sube</b>, el sistema es más exigente: <b>entran menos impostores (FAR ↓)</b> pero <b>se rechaza más a los legítimos (FRR ↑)</b>. Si se <b>baja</b>, es más cómodo (<b>FRR ↓</b>) pero menos seguro (<b>FAR ↑</b>). Se elige <b>según el uso y el riesgo de la zona</b>: umbral <b>alto</b> donde lo grave es que entre un impostor (CPD de un banco) y <b>bajo o medio</b> donde lo grave es la incomodidad (comedor, fichaje)."],
["Indica tres ventajas y tres riesgos de los sistemas biométricos, con la medida que corrige cada riesgo.","<b>Ventajas:</b> no se olvida, no se pierde y no se presta; mejor <span class='si'>trazabilidad</span> al estar vinculada a la persona; comodidad y rapidez (además evita que un compañero fiche por otro y refuerza la MFA). <b>Riesgos y medidas:</b> <span class='no'>no se puede cambiar</span> → plantillas cifradas y revocables, nunca imágenes; <b>suplantación</b> con réplicas, fotos o máscaras → <span class='si'>detección de vida</span>; <b>exclusión</b> de quien no puede registrarse (FTE) → <span class='si'>método alternativo no biométrico</span>. También: falsos rechazos → umbral adecuado y segundo intento; privacidad → verificación 1:1 y plantilla en el dispositivo; coste → usarla solo donde está justificada."],
["¿Qué dice la normativa sobre el uso de biometría para el control de presencia de los trabajadores?","Los datos biométricos que identifican de forma única son <b>categoría especial</b> (<b>RGPD art. 9</b>): su tratamiento está <span class='no'>prohibido salvo excepciones</span> y en general exige una <b>evaluación de impacto (EIPD)</b> que demuestre que son <b>necesarios y proporcionados</b>. Según la <b>guía de la AEPD de noviembre de 2023</b>, el <b>consentimiento del trabajador no suele ser válido</b> por el desequilibrio con la empresa, y si existe una <b>alternativa menos invasiva</b> (tarjeta, código) la biometría deja de ser necesaria; para <b>fichar</b>, en general, <span class='no'>no está justificada</span>. Además, el <b>Reglamento europeo de IA</b> prohíbe el <b>reconocimiento de emociones</b> en el trabajo y en los centros educativos."],
["Enumera las buenas prácticas al implantar un sistema biométrico.","<span class='n'>1)</span> Justificar la necesidad (¿hay alternativa menos invasiva?) → <b>EIPD</b>. <span class='n'>2)</span> Preferir <span class='si'>verificación 1:1</span> a identificación 1:N. <span class='n'>3)</span> Guardar <b>plantillas cifradas, nunca imágenes</b>, mejor en la tarjeta o el dispositivo que en un servidor central. <span class='n'>4)</span> Exigir <span class='si'>detección de vida</span>. <span class='n'>5)</span> <b>Combinar con otro factor</b> en zonas críticas. <span class='n'>6)</span> Ofrecer <b>siempre un método alternativo</b>. <span class='n'>7)</span> <b>Informar</b> a las personas y <b>borrar</b> las plantillas en las bajas. <span class='n'>8)</span> Ajustar el <b>umbral</b> al nivel de riesgo de cada zona."]
];

const PRACTICOS = [
["Clasifica según los <b>dos criterios</b>, indica el objeto protegido y los objetivos CIDAN:<br>a) montar un sistema <b>RAID 1</b> en un servidor de archivos · b) instalar un <b>SAI</b> en una máquina clave de un aula · c) un <b>lector de huellas</b> para encender un ordenador","<div class=\"tw\"><table><thead><tr><th>Supuesto</th><th>Tipo</th><th>Objeto protegido</th><th>CIDAN</th></tr></thead><tbody><tr><td>a) RAID 1</td><td><b>Física, pasiva</b></td><td>Datos/archivos y almacenamiento</td><td><b>I, D</b></td></tr><tr><td>b) SAI</td><td><b>Física, pasiva</b></td><td>Hardware y datos en ejecución</td><td><b>D, I</b></td></tr><tr><td>c) Lector de huellas</td><td><b>Lógica, activa</b></td><td>Acceso al equipo y a sus datos</td><td><b>C, A</b></td></tr></tbody></table></div>"],
["Clasifica según los <b>dos criterios</b>, objeto protegido y CIDAN:<br>d) <b>firmar digitalmente</b> una solicitud de beca · e) generar un <b>SHA-1</b> de un archivo · f) instalar un <b>antivirus</b> en un equipo recién comprado · g) examinar con <b>SpyBot S&amp;D</b> un equipo con mal rendimiento","<div class=\"tw\"><table><thead><tr><th>Supuesto</th><th>Tipo</th><th>Objeto protegido</th><th>CIDAN</th></tr></thead><tbody><tr><td>d) Firma digital</td><td><b>Lógica, activa</b></td><td>Documento y su autoría</td><td><b>I, A, N</b></td></tr><tr><td>e) SHA-1</td><td><b>Lógica, pasiva</b></td><td>Integridad del archivo</td><td><b>I</b></td></tr><tr><td>f) Antivirus</td><td><b>Lógica, activa</b></td><td>Sistema, programas y datos</td><td><b>C, I, D</b></td></tr><tr><td>g) SpyBot S&amp;D</td><td><b>Lógica, activa</b></td><td>Sistema, programas y datos</td><td><b>I, D</b></td></tr></tbody></table></div><p>Recuerda el razonamiento: si <b>previene o actúa en la interacción</b> → activa; si solo <b>permite recuperar o comprobar después</b> → pasiva.</p>"],
["Elabora un <b>plan de contingencia</b> para una gestoría de 5 personas cuyo servidor de archivos es crítico. Incluye las 5 fases.","<b>1. Evaluación.</b> Activos críticos: servidor de archivos (declaraciones y nóminas de clientes), NAS de copias, router y cortafuegos, centralita. Impacto: sin el servidor la gestoría no puede trabajar; la pérdida de las declaraciones implicaría incumplimiento de plazos ante Hacienda, pérdida económica, daño reputacional y notificación a la <b>AEPD</b> si hay datos personales.<br><b>2. Planificación.</b> Documentar y validar el plan con el personal afectado: copias diarias en NAS y semanales fuera de la oficina (regla 3-2-1), responsable y suplente, teléfonos de proveedor y de la compañía eléctrica, tiempo objetivo de recuperación (p. ej. 4 h), SAI para el apagado ordenado y portátil de reserva.<br><b>3. Pruebas.</b> Simular en un entorno de prueba: restaurar una copia en un equipo limpio y comprobar que los datos están completos; prueba de corte simulado del SAI; cronometrar la recuperación.<br><b>4. Ejecución.</b> Ante el fallo: avisar al responsable, pasar a trabajar con la copia o el equipo de reserva, aislar el equipo afectado si hay malware, registrar todo lo ocurrido.<br><b>5. Recuperación.</b> Reparar o sustituir el hardware, reinstalar el software, restaurar los datos de la última copia válida, verificar la integridad, volver a la operación normal y <b>revisar el plan</b> con las lecciones aprendidas."],
["Interpreta la ACL POSIX. ¿Qué puede hacer <b>realmente</b> cada uno?<pre># file: nominas\n# owner: ana\n# group: rrhh\nuser::rwx\nuser:pedro:rwx\ngroup::r-x\ngroup:becarios:rw-\nmask::r-x\nother::---</pre>1) Ana · 2) Pedro · 3) un miembro de <i>becarios</i> · 4) Luis, que no está en ningún grupo","<b>1) Ana</b> es la <b>propietaria</b>: la máscara <b>no le afecta</b> → <b>rwx</b> (todo: leer, escribir y entrar/ejecutar).<br><b>2) Pedro</b> tiene <code>rwx</code> asignado, pero la máscara es <code>r-x</code> → efectivo <b>r-x</b>: puede <b>leer y entrar, pero no escribir</b>.<br><b>3) Becarios</b> tiene <code>rw-</code> y la máscara <code>r-x</code> → <code>rw- AND r-x</code> = <b>r--</b>: solo <b>leer</b> (ni escribir ni entrar, si fuese directorio).<br><b>4) Luis</b> cae en <code>other::---</code>, que <b>no pasa por la máscara</b> → <b>ningún permiso</b>.<br><i>Clave: permiso efectivo = asignado AND máscara, salvo para el propietario y para “otros”.</i>"],
["Carpeta <code>\\\\SERVIDOR\\Proyectos</code>:<br>· Recurso compartido: <b>Todos → Leer</b><br>· NTFS: <b>Ventas → Modificar</b> (heredado)<br>· NTFS: <b>Marta</b> (de Ventas) → <b>Denegar escritura</b> (explícito)<br>1) ¿Puede Marta leer? ¿Y escribir? · 2) Juan, de Ventas, entra <b>por red</b>: ¿puede modificar? · 3) ¿Y si Juan se sienta en el propio servidor?","<b>1) Marta:</b> <b>sí puede leer</b> (tiene Modificar heredado por Ventas, y el compartido le da Leer). <b>No puede escribir</b>: el <b>denegar explícito</b> es lo primero en el orden de evaluación y gana sobre el permitir heredado.<br><b>2) Juan por red:</b> <b>no puede modificar</b>. NTFS le da Modificar, pero el <b>recurso compartido</b> solo da <b>Leer</b> y al combinarse <b>gana el más restrictivo</b> → solo lectura.<br><b>3) Juan en local:</b> <b>sí puede modificar</b>. En un acceso local <span class='no'>no se aplica</span> el permiso de recurso compartido, solo el NTFS, que le concede Modificar."],
["Con esta ACL de red, di si pasa cada paquete y <b>por qué regla</b>:<pre>10  permit tcp 192.168.10.0/24 any eq 443\n20  deny  tcp any host 192.168.20.5 eq 22\n30  permit tcp host 192.168.10.50 host 192.168.20.5 eq 22\n40  permit icmp any any\nXX  implicit deny any</pre>a) 192.168.10.7 → 8.8.8.8 TCP 443 · b) 192.168.10.50 → 192.168.20.5 TCP 22 · c) 192.168.30.4 → 192.168.20.5 ICMP · d) 192.168.10.7 → 192.168.20.5 TCP 80 · e) 192.168.30.4 → 142.250.1.1 TCP 443","<b>a) PASA</b> por la <b>regla 10</b>: origen de la red 192.168.10.0/24 y puerto 443.<br><b>b) NO PASA</b>: coincide primero con la <b>regla 20</b> (deny tcp any → host 192.168.20.5 eq 22) y, al aplicarse la primera coincidencia, la regla 30 <span class='no'>nunca se evalúa</span>.<br><b>c) PASA</b> por la <b>regla 40</b> (permit icmp any any). Las reglas 10-30 son TCP, así que no coinciden.<br><b>d) NO PASA</b>: no coincide con ninguna regla (es TCP 80 hacia 192.168.20.5) → lo descarta el <b>deny implícito</b>.<br><b>e) NO PASA</b>: el origen no está en 192.168.10.0/24, así que la regla 10 no aplica y ninguna otra coincide → <b>deny implícito</b>.<br><b>Problema del administrador (192.168.10.50) y arreglo:</b> no puede entrar por SSH porque la <b>regla 20 deniega antes</b>. Hay que colocar la regla <b>más específica delante</b>: renumerar la 30 como, por ejemplo, <span class='n'>15</span>, de modo que se evalúe antes del deny general."],
["Para cada caso di qué <b>modelo de control de acceso</b> es (DAC, MAC, RBAC o ABAC):<br>1) Compartes un documento de Drive con dos compañeros · 2) Un documento SECRETO no puede leerlo alguien con habilitación CONFIDENCIAL aunque su autor quiera · 3) Al contratar un comercial se le asigna el perfil “Comercial” en el ERP · 4) La VPN solo deja conectarse en horario laboral, desde portátiles corporativos y desde España · 5) Haces <code>chmod 640</code> a un fichero de tu carpeta · 6) Todo el personal de caja de un banco tiene los mismos permisos","<b>1) DAC</b> — decide el propietario del recurso.<br><b>2) MAC</b> — decide el sistema por etiquetas de clasificación y habilitación; ni el propietario puede saltárselo.<br><b>3) RBAC</b> — se le asigna un <b>rol</b>.<br><b>4) ABAC</b> — atributos de contexto: hora, dispositivo y ubicación.<br><b>5) DAC</b> — el propietario cambia los permisos de su fichero.<br><b>6) RBAC</b> — un rol (“personal de caja”) con los mismos permisos para todos."],
["<b>Caza el error.</b> Di qué principio incumple cada punto de esta política y redáctalo bien:<br>1) “Todos los empleados tendrán lectura y escritura en todas las carpetas del servidor” · 2) “Los permisos se asignarán directamente a cada usuario según lo pida” · 3) “Los técnicos usarán la cuenta común <code>admin</code>” · 4) “Cuando un empleado deje la empresa, su cuenta se desactivará al cierre del trimestre” · 5) “Los permisos se revisarán cuando se produzca un incidente” · 6) “Todo lo que no esté expresamente prohibido está permitido” · 7) “El responsable de compras da de alta a los proveedores y aprueba sus pagos”","<span class='n'>1)</span> Incumple <span class='si'>mínimo privilegio</span> y <b>necesidad de saber</b> → “Cada usuario tendrá únicamente los permisos imprescindibles para su puesto, asignados por grupos.”<br><span class='n'>2)</span> Incumple <b>permisos a grupos, no a personas</b> → “Los permisos se asignarán a roles o grupos, y los usuarios se incluirán en ellos; toda solicitud la aprueba el responsable del recurso.”<br><span class='n'>3)</span> Incumple la <span class='si'>trazabilidad</span> (cuentas compartidas) → “Cada técnico usará una cuenta personal e intransferible con privilegios administrativos nominales, y los accesos quedarán registrados.”<br><span class='n'>4)</span> Incumple la <b>revocación inmediata</b> → “La cuenta se desactivará <b>el mismo día</b> de la baja.”<br><span class='n'>5)</span> Incumple la <b>revisión periódica</b> → “Los permisos se revisarán al menos semestralmente y en cada cambio de puesto, además de tras cualquier incidente.”<br><span class='n'>6)</span> Incumple <b>denegar por defecto</b> → “Todo lo que no esté expresamente permitido está prohibido.”<br><span class='n'>7)</span> Incumple la <b>segregación de funciones</b> → “Quien da de alta a un proveedor no podrá aprobar sus pagos; la aprobación corresponderá a una persona distinta.”"],
["Ordena de <b>más a menos segura</b> y justifica el criterio:<br>A <code>Valencia2026!</code> · B <code>Xk9#qL</code> · C <code>naranja-tranvia-lapiz-otoño-gris</code> · D <code>P@ssw0rd</code> · E <code>123456</code> · F <code>MiPerroTobyNacioEn2019</code>","<b>Orden: C &gt; F &gt; B &gt; A &gt; D &gt; E.</b><br><b>C</b> (32 caracteres, 5 palabras poco relacionadas) es una <b>frase de contraseña</b>: la longitud le da muchísima entropía. <b>F</b> es larga (22 caracteres) pero su contenido es <b>personal y adivinable</b> por ingeniería social o redes sociales, así que va por detrás. <b>B</b> es aleatoria pero <b>solo 6 caracteres</b>: un ataque offline la rompe en segundos. <b>A</b> cumple las reglas de composición pero sigue el <b>patrón previsible</b> palabra + año + símbolo, que los ataques híbridos prueban. <b>D</b> es una de las contraseñas más conocidas, con <b>leetspeak</b> trivial (<code>a→@</code>, <code>o→0</code>), y está en todas las listas negras. <b>E</b> es la contraseña más usada del mundo: instantánea.<br><b>Criterio:</b> manda la <span class='si'>longitud</span> y la <b>imprevisibilidad</b>, no la presencia de símbolos."],
["Identifica el <b>ataque</b> de cada caso:<br>1) Un atacante prueba <code>Verano2026!</code> en las 500 cuentas de correo de una universidad · 2) Se filtra una tienda online y al día siguiente entran en tu Instagram con los mismos datos · 3) Un programa prueba <code>aaaa</code>, <code>aaab</code>, <code>aaac</code>… · 4) Recibes un SMS de “tu banco” con un enlace para “verificar tu cuenta” · 5) Con la lista de 10 millones de contraseñas más usadas y añadiendo años y símbolos se descubre <code>Futbol1998$</code> · 6) En la cafetería alguien graba con el móvil cómo teclas el PIN","<b>1) Password spraying</b> — pocas contraseñas comunes en muchas cuentas, para no disparar los bloqueos.<br><b>2) Credential stuffing</b> — credenciales filtradas de otro sitio reutilizadas. Defensa: no reutilizar + MFA.<br><b>3) Fuerza bruta</b> — todas las combinaciones posibles. Defensa: longitud.<br><b>4) Phishing</b> (por SMS, <i>smishing</i>) — ingeniería social para que entregues la credencial.<br><b>5) Ataque de diccionario con reglas o híbrido</b> — diccionario + variaciones previsibles.<br><b>6) Shoulder surfing</b> — observar o grabar al usuario teclear."],
["Indica si es <b>mito (M)</b> o <b>realidad (R)</b> y justifica en una línea:<br>1) Cambiar la contraseña cada mes es más seguro · 2) <code>Tr0mp3t@</code> es más segura que <code>trompeta azul en la playa</code> · 3) Un gestor pone todos los huevos en la misma cesta, es peor · 4) Con MFA una contraseña robada ya no basta · 5) Las preguntas de seguridad son una buena forma de recuperar la cuenta · 6) Si la empresa guarda con MD5, da igual lo largas que sean · 7) La contraseña de fábrica del router es segura porque es aleatoria · 8) Bloquear la cuenta tras unos intentos fallidos frena los ataques online","<b>1) M</b> — el NIST 2025 lo descarta: lleva a patrones previsibles (<code>Verano2026! → Otoño2026!</code>); solo se cambia ante indicios de compromiso.<br><b>2) M</b> — manda la longitud: la frase tiene muchísima más entropía; <code>Tr0mp3t@</code> es diccionario + leetspeak trivial.<br><b>3) M</b> — permite una contraseña única y larga por servicio; el riesgo se concentra pero se protege con una maestra larga + MFA, y el balance es claramente favorable.<br><b>4) R</b> — el atacante necesitaría también el segundo factor (matiz: el MFA por SMS o por notificación es vulnerable a phishing en tiempo real y a <i>fatiga de MFA</i>; FIDO2 o passkey resisten).<br><b>5) M</b> — están <b>prohibidas</b> por el NIST: las respuestas son públicas o adivinables.<br><b>6) M, con matiz</b> — MD5 es rapidísimo y no sirve, pero una contraseña <b>suficientemente larga y aleatoria</b> sigue siendo inviable por fuerza bruta; lo que sí es cierto es que las cortas o previsibles caen enseguida y que el almacenamiento es inaceptable.<br><b>7) M</b> — muchas son comunes por modelo, están en listas publicadas y a veces se derivan del número de serie o la MAC; hay que cambiarla al instalar.<br><b>8) R</b> — limita los ataques <b>online</b>; no afecta a los <b>offline</b> con los hashes robados, y hay que ajustarlo para no facilitar una denegación de servicio."],
["Identifica la <b>perturbación eléctrica</b> de cada caso:<br>1) Las luces parpadean un instante y el ordenador se reinicia · 2) Durante una tormenta se estropea la fuente del router · 3) Cada vez que arranca el compresor del aire acondicionado la tensión baja unos segundos · 4) En una nave rural el polímetro marca 250 V de forma continuada · 5) Junto a un taller con soldadores los equipos dan errores aleatorios · 6) Se va la luz en todo el polígono durante dos horas","<b>1) Microcorte</b> — interrupción de milisegundos; provoca reinicios inesperados.<br><b>2) Pico o transitorio</b> — subida muy breve y muy alta por el rayo; daña fuentes y placas.<br><b>3) Subtensión</b> — tensión por debajo de lo normal durante unos segundos.<br><b>4) Sobretensión sostenida</b> — por encima de lo normal (230 V nominales) de forma continuada; sobrecalentamiento y averías.<br><b>5) Ruido eléctrico</b> — interferencias de motores y maquinaria.<br><b>6) Corte</b> — falta total de tensión durante horas."],
["¿Qué <b>tipo de SAI</b> elegirías y por qué?<br>1) El ordenador del mostrador de una tienda · 2) Oficina pequeña con servidor y NAS en zona con bajadas de tensión frecuentes · 3) Sala de servidores de un centro de control 24 h · 4) Nave rural con tensión inestable y generador diésel de respaldo · 5) Router y ONT de fibra de una vivienda · 6) Dos servidores nuevos con fuentes de PFC activo","<b>1) Off-line (VFD)</b> — un PC de mostrador solo necesita aguantar cortes y picos el tiempo de guardar y apagar; es la opción más barata.<br><b>2) Line-interactive (VI)</b> — su <b>AVR</b> corrige las bajadas de tensión <b>sin gastar batería</b>, que es justo el problema descrito.<br><b>3) On-line doble conversión (VFI)</b> — equipos críticos 24/7: conmutación <span class='si'>cero</span>, senoidal pura y protección total; idealmente con <b>redundancia N+1</b> y grupo electrógeno.<br><b>4) On-line (VFI)</b> — es el único que corrige la <b>variación de frecuencia</b>, habitual cuando alimenta un <b>generador diésel</b>, además de la tensión inestable.<br><b>5) Off-line (VFD)</b> — consumo bajísimo y solo hace falta cubrir cortes breves para no perder la conexión.<br><b>6) On-line (VFI)</b>, o como mínimo interactivo con <span class='si'>senoidal pura</span> — las fuentes con <b>PFC activo</b> pueden funcionar mal con onda escalonada."],
["<b>Dimensiona el SAI</b> de la sala técnica de una gestoría. Equipos: servidor con PFC activo <span class='n'>320 W</span>, NAS de 4 discos <span class='n'>60 W</span>, switch de 24 puertos <span class='n'>30 W</span>, router + cortafuegos <span class='n'>25 W</span>, centralita IP <span class='n'>15 W</span>. El apagado ordenado tarda <span class='n'>8 minutos</span>. Indica potencia, tipo, autonomía y qué más tendrías en cuenta.","<b>1) Carga total:</b> 320 + 60 + 30 + 25 + 15 = <span class='n'>450 W</span>.<br><b>2) Margen del 70-80 %:</b> potencia mínima = 450 ÷ 0,75 = <span class='n'>600 W</span>.<br><b>3) Paso a VA:</b> con FP = 0,6 → 600 ÷ 0,6 = <span class='n'>1.000 VA</span>; con FP = 0,7 → ≈ 860 VA. Hay que <span class='si'>cumplir los dos límites</span>, así que conviene un SAI de al menos <span class='n'>1.000-1.500 VA / 600-900 W</span>. Un <span class='n'>1500 VA / 900 W</span> encaja bien: la carga de 450 W es el <span class='n'>50 %</span> de su capacidad, lo que deja margen de crecimiento y mejora la autonomía.<br><b>4) Autonomía:</b> necesitamos los <span class='n'>8 minutos</span> del apagado ordenado <b>más un margen</b> (10-15 min reales) para absorber microcortes y esperar a ver si vuelve la luz. Estimación con la fórmula: con 2 baterías de 12 V y 9 Ah (216 Wh) y η = 0,85 → 216 × 0,85 ÷ 450 ≈ <span class='n'>0,41 h ≈ 24 min</span>, suficiente. Pero esa cifra es <b>optimista</b> (<b>efecto Peukert</b>, edad y calor), así que <b>hay que confirmarla en las tablas de autonomía del fabricante</b> para 450 W.<br><b>5) Tipo y forma de onda:</b> el servidor tiene <b>PFC activo</b> → <span class='si'>senoidal pura</span>: <b>on-line (VFI)</b> o interactivo de gama alta con senoidal pura.<br><b>6) Otros requisitos:</b> comunicación <b>USB o tarjeta de red SNMP</b> para el apagado ordenado con NUT/apcupsd; número y tipo de tomas (IEC para rack) separando tomas con batería de las de solo protección; formato <b>rack</b> si hay armario; ubicación ventilada a <span class='n'>20-25 °C</span> y en la parte baja del rack; y <span class='no'>nada de impresoras láser</span> enchufadas."],
["Un SAI tiene <b>2 baterías de 12 V y 7 Ah</b>, rendimiento del inversor <span class='n'>η = 0,9</span>, y alimenta una carga de <span class='n'>300 W</span>. Calcula la autonomía estimada y comenta el resultado.","<b>Energía de las baterías:</b> están en serie → 12 + 12 = <span class='n'>24 V</span>. Energía = 24 V × 7 Ah = <span class='n'>168 Wh</span>.<br><b>Autonomía:</b> t = (24 × 7 × 0,9) ÷ 300 = 151,2 ÷ 300 = <span class='n'>0,504 h ≈ 30 minutos</span>.<br><b>Comentario:</b> la cifra es <b>optimista</b>. Por el <b>efecto Peukert</b>, cuanto más rápido se descarga la batería menos energía entrega; además la capacidad <b>baja con la edad</b> (las VRLA duran 3-5 años) y <b>con el calor</b>. Hay que <b>comprobar la tabla de autonomía del fabricante</b> para 300 W y dejar margen sobre el tiempo que tarda el apagado ordenado."],
["Un SAI es de <span class='n'>2000 VA / 1200 W</span>. a) ¿Cuál es su factor de potencia? b) ¿Puedo conectar equipos que suman <span class='n'>1.300 W</span>? c) ¿Y equipos que suman <span class='n'>900 W</span>, respetando el margen recomendado?","<b>a)</b> FP = W ÷ VA = 1200 ÷ 2000 = <span class='n'>0,6</span>.<br><b>b) No.</b> Aunque 1.300 W quepa en los 2000 VA aparentes, <b>supera el límite de 1200 W</b> y hay que <span class='si'>cumplir los dos límites</span> a la vez. El SAI se sobrecargaría.<br><b>c) Sí.</b> 900 W es el <span class='n'>75 %</span> de 1200 W, justo en el margen recomendado del <span class='n'>70-80 %</span>. En VA: 900 ÷ 0,6 = 1.500 VA, también el 75 % de 2000 VA. Queda margen para crecer y se alarga la vida del equipo."],
["Clasifica cada equipo como <b>B</b> (toma con batería), <b>P</b> (solo protección contra picos) o <b>N</b> (no conectar al SAI): servidor · impresora láser · switch principal · cafetera · grabador de cámaras (NVR) · router de fibra · monitor de la recepción · lector de control de accesos · cargador de móviles · estufa eléctrica · TPV · centralita telefónica.","<b>B — con batería:</b> servidor, switch principal, grabador de cámaras (NVR), router de fibra, lector de control de accesos, TPV y centralita telefónica. Son críticos: si se apagan, se pierden datos o la empresa no puede trabajar.<br><b>P — solo protección:</b> monitor de la recepción y cargador de móviles. No son críticos, pero conviene protegerlos de picos.<br><b>N — no conectar:</b> <b>impresora láser</b> (el <b>fusor</b> tiene picos de consumo muy altos), <b>cafetera</b> y <b>estufa eléctrica</b> (cargas térmicas y motores que consumen muchísimo y agotarían la batería).<br><i>Nota: el monitor del servidor sí iría a batería si hace falta para el apagado.</i>"],
["Interpreta la salida de <code>upsc</code>:<pre>battery.charge: 38\nbattery.charge.low: 20\nbattery.date: 2021/03/15\nbattery.runtime: 420\ninput.voltage: 0.0\noutput.voltage: 230.0\nups.load: 64\nups.status: OB DISCHRG\nups.temperature: 34\nups.test.result: Done and warning</pre>1) ¿Hay corriente en la red? ¿Cómo lo sabes? · 2) ¿Cuántos minutos de autonomía quedan? · 3) ¿Qué ocurrirá al llegar al 20 %? · 4) Señala tres datos preocupantes y qué harías.","<b>1) No hay corriente.</b> <code>input.voltage: 0.0</code> indica que no entra tensión de la red, y <code>ups.status: OB DISCHRG</code> significa <b>On Battery</b> y descargando. Aun así <code>output.voltage: 230.0</code>: el <b>inversor</b> sigue alimentando los equipos desde la batería.<br><span class='n'>2)</span> <code>battery.runtime: 420</code> está en <b>segundos</b> → 420 ÷ 60 = <span class='n'>7 minutos</span>.<br><span class='n'>3)</span> Al bajar al <span class='n'>20 %</span> (<code>battery.charge.low</code>) el software de gestión lanzará el <b>apagado ordenado</b> (máquinas virtuales → servidores de aplicaciones → bases de datos → NAS) y después el <b>SAI se apagará</b> para no descargar del todo las baterías.<br><b>4) Datos preocupantes:</b><br>· <b>Solo 7 minutos de autonomía con el 38 %</b> y la carga al 64 %: puede no dar tiempo al apagado ordenado completo → revisar el umbral de inicio del apagado (subirlo), reducir la carga conectada o ampliar baterías.<br>· <b><code>battery.date: 2021/03/15</code></b>: la batería tiene más de 4 años y las <b>VRLA duran 3-5</b> → <b>programar su sustitución</b> ya y hacer una calibración de autonomía.<br>· <b><code>ups.temperature: 34</code></b>: muy por encima de los <span class='n'>20-25 °C</span> recomendados; el calor acorta mucho la vida de las baterías → mejorar la <b>ventilación</b> de la sala y comprobar la ubicación del SAI.<br>· <b><code>ups.test.result: Done and warning</code></b>: el autotest avisa de un problema → revisar el registro de eventos y diagnosticar batería e inversor.<br><i>(Y ante todo: comprobar por qué falta la corriente y avisar al responsable.)</i>"],
["Ordena los pasos de una <b>prueba de corte simulado</b> semestral:<br>A. Restablecer la alimentación y comprobar que el SAI recarga · B. Comprobar que el software de monitorización recibe el aviso · C. Avisar a los usuarios y programar la prueba fuera del horario de trabajo · D. Anotar los resultados en el registro de mantenimiento · E. Comprobar que hay copia de seguridad reciente · F. Desconectar la entrada del SAI · G. Revisar el estado previo: batería cargada, sin alarmas, carga conectada · H. Comprobar que los equipos siguen funcionando con batería","<b>Orden: C → E → G → F → H → B → A → D.</b><br><b>C</b> Avisar y programar fuera de horario (es una prueba con riesgo real).<br><b>E</b> Comprobar que hay <b>copia de seguridad reciente</b>: red de seguridad por si algo sale mal.<br><b>G</b> Revisar el estado previo: batería cargada, sin alarmas, carga conectada.<br><b>F</b> Desconectar la entrada del SAI o lanzar la prueba desde el software.<br><b>H</b> Comprobar que los equipos <b>siguen funcionando con batería</b>.<br><b>B</b> Comprobar que el software de monitorización <b>recibe el aviso</b>.<br><b>A</b> Restablecer la alimentación y comprobar que el SAI <b>recarga</b>.<br><b>D</b> <b>Anotar los resultados</b> en el registro de mantenimiento.<br><i>Lógica: preparar y proteger → provocar el corte → verificar durante → restablecer → documentar.</i>"],
["Prueba de un lector de huella: <span class='n'>1.000</span> intentos de personas <b>no registradas</b> → <span class='n'>5</span> acceden. <span class='n'>2.000</span> intentos de personas <b>registradas</b> → <span class='n'>60</span> son rechazados. Calcula FAR y FRR e interpreta los resultados.","<b>FAR</b> = falsas aceptaciones ÷ intentos de impostores = 5 ÷ 1.000 = 0,005 = <span class='n'>0,5 %</span>.<br><b>FRR</b> = falsos rechazos ÷ intentos legítimos = 60 ÷ 2.000 = 0,03 = <span class='n'>3 %</span>.<br><b>Interpretación:</b> de cada 200 impostores, uno consigue entrar (problema de <b>seguridad</b>); y 3 de cada 100 accesos legítimos se rechazan (problema de <b>comodidad</b>). Como <b>FRR &gt; FAR</b>, el umbral está <b>por encima</b> del EER, es decir, del lado <b>exigente</b>: razonable para una zona de seguridad media-alta. Si fuese un CPD de un banco podríamos <b>subir</b> más el umbral (bajar el FAR aceptando más rechazos); si fuese un comedor, <b>bajarlo</b>."],
["El mismo lector con tres umbrales:<div class=\"tw\"><table><thead><tr><th>Umbral</th><th>FAR</th><th>FRR</th></tr></thead><tbody><tr><td>Bajo</td><td>2 %</td><td>0,5 %</td></tr><tr><td>Medio</td><td>0,5 %</td><td>2 %</td></tr><tr><td>Alto</td><td>0,01 %</td><td>8 %</td></tr></tbody></table></div>1) ¿Qué umbral pondrías en el <b>CPD de un banco</b>, el <b>comedor</b> de la empresa y el <b>desbloqueo de un móvil</b>? · 2) Una empresa tiene <b>30 empleados</b> que pasan el lector <b>4 veces al día</b> con umbral <b>alto</b>: ¿cuántos falsos rechazos habrá al día? ¿Qué problema provoca? ¿Cómo lo resolverías?","<b>1) Elección de umbral</b><br>· <b>CPD de un banco → ALTO.</b> Lo grave es que entre un impostor; con FAR del 0,01 % se acepta un FRR del 8 % porque entran pocas personas y la seguridad manda. Además debe ir con <span class='si'>MFA</span> (tarjeta + huella) y método alternativo.<br>· <b>Comedor → BAJO.</b> El riesgo es mínimo y lo importante es la fluidez: un FRR del 0,5 % evita colas; un FAR del 2 % es asumible porque lo peor que pasa es que alguien coma gratis.<br>· <b>Móvil → MEDIO.</b> Hay que equilibrar: un FRR del 8 % sería insufrible varias veces al día y un FAR del 2 % es demasiado para un dispositivo con el banco dentro. Además el móvil tiene <b>PIN de respaldo</b> y bloqueo tras varios fallos.<br><b>2) Cálculo</b><br>Intentos al día = 30 × 4 = <span class='n'>120</span>. Falsos rechazos = 120 × 8 % = <b>9,6 ≈ 10 rechazos al día</b>.<br><b>Problema:</b> unos 10 incidentes diarios generan <b>colas, pérdida de tiempo, llamadas al departamento de IT</b> y, sobre todo, que la gente busque atajos (dejar la puerta abierta, pasar varias personas con un solo acceso), lo que <b>empeora la seguridad real</b>.<br><b>Soluciones:</b> <b>bajar el umbral a medio</b> si la zona no es crítica (el FRR pasaría a 2 % ≈ 2-3 rechazos diarios); permitir un <b>segundo intento</b> automático antes de contar el rechazo; <b>reenrolar</b> con más capturas a los empleados que fallan a menudo; usar <span class='si'>MFA</span> (tarjeta + huella) para poder bajar el umbral sin perder seguridad; mejorar el <b>sensor</b> (ultrasonido o venas de la palma, más tolerantes); y ofrecer siempre un <span class='si'>método alternativo</span> para los casos de FTE."],
["¿Es <b>verificación (1:1)</b> o <b>identificación (1:N)</b>?<br>1) Desbloqueas tu móvil con la huella · 2) Pasas la tarjeta por el lector del CPD y luego pones el dedo · 3) Una puerta se abre sola al reconocer la cara de cualquier empleado registrado · 4) Entras en la aplicación del banco con la cara · 5) Un sistema busca a una persona concreta comparando su foto con las de una base de datos · 6) Fichas en el trabajo con un lector de huellas","<b>1) Verificación 1:1</b> — se compara con la plantilla del dueño del dispositivo.<br><b>2) Verificación 1:1</b> — la tarjeta identifica primero; además es <span class='si'>MFA</span> (algo que tienes + algo que eres).<br><b>3) Identificación 1:N</b> — no hay identificación previa, se compara con todas las plantillas.<br><b>4) Verificación 1:1</b> — la sesión o el usuario ya está identificado.<br><b>5) Identificación 1:N</b> — búsqueda contra toda la base de datos.<br><b>6) Depende:</b> si pasas tarjeta o tecleas un código antes, es <span class='n'>1:1</span>; si solo pones el dedo y el sistema averigua quién eres, es <b>1:N</b>. <i>(Añade que, según la AEPD, fichar con biometría en general <b>no está justificado</b>.)</i>"],
["¿Qué <b>técnica biométrica</b> recomendarías y por qué?<br>1) Sala de servidores de una entidad financiera · 2) Una obra, con trabajadores con guantes y manos sucias o con cortes · 3) Un quirófano, con personal con mascarilla, gorro y guantes · 4) Acceso de los socios a un gimnasio · 5) Inicio de sesión en los portátiles de una consultoría · 6) Un laboratorio con zonas de distinto nivel de seguridad","<b>1) Iris o venas de la palma, combinadas con tarjeta (MFA) y umbral alto.</b> Precisión muy alta, difíciles de falsificar y sin contacto; el coste se justifica en una zona crítica. Con <span class='si'>detección de vida</span> y registro de accesos.<br><b>2) Iris o reconocimiento facial</b> — <b>sin contacto</b>: la huella falla con guantes, suciedad y cortes (alto FRR y FTE). Si debe ser barato, facial con buena iluminación; alternativa no biométrica siempre disponible (tarjeta).<br><b>3) Iris o venas de la palma</b> — sin contacto y <b>no afectadas por mascarilla, gorro ni guantes</b>, que descartan huella y facial. Además evita contaminación en un entorno estéril.<br><b>4) Huella dactilar</b> — barata, rápida, muy aceptada y suficiente para un riesgo bajo, con umbral bajo-medio. <i>Importante: hay que valorar la <b>proporcionalidad</b> (RGPD art. 9); si basta una tarjeta, la biometría no es necesaria, y debe haber alternativa.</i><br><b>5) Huella o facial, la integrada en el portátil</b> — coste nulo (ya la traen), cómoda y con la <b>plantilla en el propio dispositivo</b> (1:1, lo menos invasivo); como <b>segundo factor</b> junto a la contraseña, no en sustitución.<br><b>6) Combinación por zonas:</b> huella o tarjeta en el acceso general y, en las zonas críticas, <b>MFA con iris o venas</b> y <b>umbral más alto</b>. Es la aplicación del <span class='si'>mínimo privilegio</span> y de “ajustar el umbral al riesgo de cada zona”."],
["Una empresa quiere implantar <b>reconocimiento facial para fichar</b> la jornada de sus 40 empleados. Valora la propuesta desde el punto de vista <b>técnico y legal</b> y propón alternativas.","<b>Valoración legal (lo decisivo):</b> los datos biométricos que identifican de forma única son <b>categoría especial</b> (<b>RGPD art. 9</b>) y su tratamiento está <span class='no'>prohibido salvo excepciones</span>. La <b>guía de la AEPD de noviembre de 2023</b> es muy clara: para el <b>registro de jornada</b>, en general, <span class='no'>no está justificada</span>; el <b>consentimiento del trabajador no suele ser válido</b> por el <b>desequilibrio</b> con la empresa; y si existe una <b>alternativa menos invasiva</b> (tarjeta, código, PIN), la biometría <b>deja de ser necesaria y proporcionada</b>. Haría falta además una <b>evaluación de impacto (EIPD)</b>, que con toda probabilidad concluiría que no procede. Si además el sistema analizara estados de ánimo, el <b>Reglamento europeo de IA</b> prohíbe el <b>reconocimiento de emociones en el trabajo</b>.<br><b>Valoración técnica:</b> el facial 2D es de precisión <b>media</b> y sensible a iluminación, mascarillas, gafas y envejecimiento → <b>FRR</b> alto y discusiones sobre el fichaje; exige <b>identificación 1:N</b> con <b>base de datos centralizada</b> de plantillas, que es el escenario de <b>mayor riesgo</b> si hay una brecha, y la plantilla comprometida <span class='no'>no se puede cambiar</span>; habría <b>FTE</b> y necesidad de método alternativo de todos modos; y requiere <span class='si'>detección de vida</span> para que no valga una foto.<br><b>Conclusión y alternativas:</b> <span class='no'>no implantarlo</span>. Usar <b>tarjeta o llavero NFC</b> con PIN, una <b>app de fichaje</b> en el móvil corporativo o un <b>código personal</b> en un terminal: cumplen la obligación de registro de jornada sin tratar datos especiales. Si se quisiera reforzar el control de acceso a una <b>zona realmente crítica</b> (el CPD, no la entrada), entonces sí cabría biometría, pero con <span class='si'>verificación 1:1</span>, <b>plantilla en la tarjeta o el dispositivo</b> (<i>match-on-card</i>), cifrada, con <span class='si'>detección de vida</span>, <b>EIPD</b> previa, información a los trabajadores, borrado en las bajas y <span class='si'>método alternativo</span> siempre disponible."]
];

 {h:"Listas numeradas que suelen pedir enteras", html:`<div class="tw"><table><thead><tr><th>Lista</th><th>Elementos</th></tr></thead><tbody>
 <tr><td><b>CIDAN</b></td><td>Confidencialidad · Integridad · Disponibilidad · Autenticidad · No repudio</td></tr>
 <tr><td><b>Plan de contingencia (5)</b></td><td>Evaluación · Planificación · Pruebas · Ejecución · Recuperación</td></tr>

 <tr><td><b>Orden NTFS (4)</b></td><td>Denegar explícito · Permitir explícito · Denegar heredado · Permitir heredado</td></tr>

const N_TEST=20,N_CORTA=6,N_PRAC=14, P_TEST=3/N_TEST, P_CORTA=3/N_CORTA, P_PRAC=4/N_PRAC;
let ex=null;
function muestra(arr,n){const i=arr.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,n);return i;}
function nuevoExamen(){ex={t:muestra(TEST,N_TEST),c:muestra(CORTAS,N_CORTA),p:muestra(PRACTICOS,N_PRAC),
 resT:{},resC:{},resP:{},corregido:false};}
function montarExamen(){if(!ex)return pintarIntro();pintarExamen();}

function pintarIntro(){$("#exmount").innerHTML=`<div class="sechead"><span class="eyebrow">Mismo formato que el examen del lunes</span><h2>Simulacro de examen</h2>
 <p class="lede">Las preguntas se eligen al azar del banco cada vez que empiezas, así que puedes repetirlo varias veces y no te saldrá lo mismo.</p></div>
 <div class="examintro">
 <div class="part"><div class="n">20</div><div class="t">Tipo test</div><div class="p">3 puntos sobre 10 · se corrigen solas</div></div>
 <div class="part"><div class="n">6</div><div class="t">Preguntas cortas</div><div class="p">3 puntos · escribes y comparas con la solución</div></div>
 <div class="part"><div class="n">14</div><div class="t">Casos prácticos</div><div class="p">4 puntos · cálculos y desarrollo</div></div></div>
 <div class="note tip"><span class="lbl">Cómo se corrige</span>El test se corrige automáticamente. En las cortas y los casos prácticos escribes tu respuesta, ves la solución y te puntúas tú con los botones <b>Bien</b> / <b>A medias</b> / <b>Mal</b>: así sale la nota final sobre 10. Sé honesto contigo, es lo que hace que sirva.</div>

function pintarExamen(){const C=ex.corregido;
 let h=`<div class="sechead"><span class="eyebrow">${C?"Corregido":"En curso"}</span><h2>Simulacro de examen</h2></div>`;
 if(C)h+=tarjetaNota();
 h+=`<div class="partbar">Parte 1 · Tipo test <span>20 preguntas · 3 puntos</span></div>`;
 ex.t.forEach((qi,n)=>{const q=TEST[qi];const sel=ex.resT[n];

   if(C){if(oi===q[2])cls+=" good";else if(sel===oi)cls+=" bad";}
   h+=`<label class="${cls}"><input type="radio" name="t${n}" value="${oi}" ${sel===oi?"checked":""} ${C?"disabled":""} data-t="${n}"><span>${o}</span></label>`;});
  h+=`</div>`;
  if(C)h+=`<div class="sol"><span class="lbl">${sel===q[2]?"Correcta":(sel===undefined?"Sin contestar":"Incorrecta")}</span>${q[3]}</div>`;

 h+=`<div class="partbar">Parte 2 · Preguntas cortas <span>6 preguntas · 3 puntos</span></div>`;
 ex.c.forEach((qi,n)=>{const q=CORTAS[qi];
  h+=`<div class="q"><div class="qhead"><span class="qnum">${n+1}</span><span class="qtext">${q[0]}</span></div>

   const store=k==="c"?ex.resC:ex.resP;store[n]=Object.assign({},store[n],{nota:v});

function autoeval(k,n){const store=k==="c"?ex.resC:ex.resP;const v=store[n]&&store[n].nota;
 return `<div class="selfrow"><span class="lab">Tu nota</span>
 <button class="sbtn s1" data-k="${k}" data-n="${n}" data-v="1" aria-pressed="${v===1}">Bien</button>
 <button class="sbtn s05" data-k="${k}" data-n="${n}" data-v="0.5" aria-pressed="${v===0.5}">A medias</button>
 <button class="sbtn s0" data-k="${k}" data-n="${n}" data-v="0" aria-pressed="${v===0}">Mal</button></div>`;}

function calcular(){let t=0;ex.t.forEach((qi,n)=>{if(ex.resT[n]===TEST[qi][2])t++;});
 let c=0,cEval=0;ex.c.forEach((_,n)=>{const r=ex.resC[n];if(r&&r.nota!==undefined){c+=r.nota;cEval++}});
 let p=0,pEval=0;ex.p.forEach((_,n)=>{const r=ex.resP[n];if(r&&r.nota!==undefined){p+=r.nota;pEval++}});
 return {acierto:t,pt:t*P_TEST,pc:c*P_CORTA,pp:p*P_PRAC,cEval,pEval,
  total:t*P_TEST+c*P_CORTA+p*P_PRAC};}
function tarjetaNota(){return `<div id="notaBox">${tarjetaNotaInner()}</div>`;}
function tarjetaNotaInner(){const r=calcular();const n=r.total;
 const pend=(N_CORTA-r.cEval)+(N_PRAC-r.pEval);
 return `<div class="scorecard"><div class="lbl">Nota del simulacro</div><div class="big">${n.toFixed(2)}</div>
